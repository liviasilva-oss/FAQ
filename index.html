<style>
:root{--navy:#252F67;--navy2:#1a2350;--gold:#F8CA10;--bg:#f4f5fa;--card:#fff;--txt:#2b2f45;--mut:#6b7190;--bd:#e3e6f0;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gotham','Montserrat','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 28px 18px;display:flex;align-items:center;gap:18px}
.logo-badge{background:#fff;border-radius:14px;padding:8px 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.logo-badge img{height:64px;display:block}
header h1{font-size:22px;font-weight:800;letter-spacing:.3px}
header h1 span{color:var(--gold)}
header p{font-size:13px;opacity:.85;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 28px 0;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.tabs button{border:0;padding:10px 18px;border-radius:10px 10px 0 0;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.tabs button.active{background:var(--bg);color:var(--navy)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:18px 28px 6px;align-items:center}
.toolbar input,.toolbar select{padding:10px 14px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:#fff}
.toolbar input{flex:1;min-width:220px}
.count{font-size:12px;color:var(--mut);margin-left:auto}
.subtabs{display:flex;gap:8px;padding:8px 28px 0}
.subtabs button{border:1px solid var(--bd);background:#fff;padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mut)}
.subtabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:14px 28px 50px;max-width:1200px}
.group-title{font-size:15px;font-weight:800;color:var(--navy);margin:22px 0 10px;border-left:4px solid var(--gold);padding-left:10px;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.card-head:hover{background:#fafbff}
.card-head .titles{flex:1}
.card-head .motivo{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.card-head .sub{font-size:15px;font-weight:700;color:var(--navy);margin-top:2px}
.sla{font-size:11px;font-weight:700;background:var(--gold);color:var(--navy);padding:4px 10px;border-radius:12px;white-space:nowrap}
.chev{color:var(--mut);transition:.2s}
.card.open .chev{transform:rotate(90deg)}
.card-body{display:none;padding:0 18px 18px;border-top:1px solid var(--bd)}
.card.open .card-body{display:block}
.block{margin-top:14px}
.block h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.block.interna h4{color:#b26a00}
.block.aluno h4{color:#1a7a4a}
.block .txt{font-size:14px;line-height:1.55;white-space:pre-wrap;background:#fafbfd;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.block.interna .txt{background:#fff9ec;border-color:#f2e3b8}
.block.aluno .txt{background:#f0faf4;border-color:#cdebd9}
.copy{border:0;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:8px;cursor:pointer}
.copy:hover{background:var(--navy2)}
.empty{color:var(--mut);font-size:14px;padding:30px 0;text-align:center}
mark{background:var(--gold);border-radius:3px;padding:0 1px}
@media(max-width:640px){header,main,.tabs,.toolbar,.subtabs{padding-left:14px;padding-right:14px}}
</style>
</head>

\nTel: (19) 2514-2100\nEndereço: Rua Delfino Cintra, 404, Centro — CEP 13020-100, Campinas/SP\n\nE-mails:\n• Principal: campinas2@cartoriosantacruz.com.br\n• Procuração: procuracao@cartoriosantacruz.com.br\n• Apostilamento: apostila@cartoriosantacruz.com.br", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "Acesso ao Portal de Periódicos da CAPES", "i": "Acesso via CAFe. Sigla da instituição: FSLM. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "Para acessar o Portal de Periódicos da CAPES:\n\n1. Acesse: https://www.periodicos.capes.gov.br/\n2. Selecione a opção Acesso CAFe.\n3. Informe a sigla da instituição: FSLM\n4. Use o login e a senha que você utiliza para acessar o Portal do Aluno. 😊\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "UpToDate", "i": "Plataforma de informação em saúde para síntese de conhecimentos, com tópicos de diversas especialidades médicas, textos, gráficos, resumos, referências, vídeos e banco de dados de medicamentos. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "O UpToDate é uma plataforma de informação na área da saúde dedicada à síntese de conhecimentos para uso de médicos e pacientes. Abrange diversos tópicos em diferentes especialidades médicas e inclui textos, gráficos, resumos, referências, vídeos e um banco de dados de medicamentos.\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "App SophiA Biblioteca", "i": "Versão mobile do catálogo online do SophiA Biblioteca. Passo a passo de instalação e acesso em slmandic.edu.br/biblioteca/tecnologia.", "r": "A Biblioteca da Faculdade São Leopoldo Mandic disponibiliza a versão mobile do catálogo online, o app SophiA Biblioteca.\n\nPelo aplicativo você acessa, no seu smartphone ou tablet, informações atualizadas dos seus empréstimos, podendo renová-los, além de realizar e cancelar reservas.\n\nPasso a passo de instalação e acesso disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Financeiro", "m": "Inadimplência", "s": "Inadimplência e bloqueio de acesso", "i": "O sistema bloqueia o acesso automaticamente 1 dia após o vencimento da pendência e envia lembrete 1 dia antes do vencimento. O acesso é normalizado somente após a regularização do débito. Conduzir esse tipo de situação de forma discreta e acolhedora, preservando a privacidade do estudante.", "r": "Lamentamos sinceramente que essa situação tenha causado qualquer tipo de constrangimento.\n\nCom relação ao bloqueio de acesso, informamos que nosso sistema está parametrizado para realizá-lo automaticamente um dia após o vencimento da pendência. Da mesma forma, o sistema encaminha um lembrete um dia antes da data de vencimento, como forma de auxiliar no acompanhamento da regularização.\n\nO acesso é normalizado somente após a regularização do débito. Por esse motivo, a orientação é de que seria necessário verificar e regularizar a situação junto ao setor financeiro antes de retornar às atividades acadêmicas.\n\nAgradecemos por compartilhar sua percepção conosco.", "sla": ""}, {"g": "Acadêmico", "m": "Iniciação Científica", "s": "Projeto de Iniciação Científica (PIC) - Regulamento", "i": "O Regulamento do Projeto de Iniciação Científica está disponível no site, na seção Documentos Regulatórios.", "r": "O Regulamento do Projeto de Iniciação Científica (PIC) está disponível em nosso site, na seção de Documentos Regulatórios. 😊\n\n🔗 https://slmandic.edu.br/documentos-regulatorios", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "Vestibular Medicina 2027.1-A", "s": "Como funciona a bolsa (confirmar qual vestibular)", "i": "Antes de responder, confirmar em qual vestibular MED 2027.1-A o candidato se inscreveu — as regras de bolsa são diferentes: (1) ENEM e Certificações Internacionais → bolsa só para modalidade ENEM, 50%, 1º lugar da unidade + média ENEM ≥ 650; (2) Provas Presencial/On-line → 80 bolsas escalonadas 50%/30%/20% por colocação. Não misturar as regras. Regras de manutenção e exclusões são iguais nos dois.", "r": "As bolsas por mérito acadêmico do Vestibular de Medicina 2027.1-A são um desconto parcial na mensalidade, concedido por desempenho. As regras variam conforme o vestibular escolhido (ENEM e Certificações Internacionais ou Provas Presencial/On-line). Me confirma qual você prestou que te explico as condições certinhas. 😊", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "Vestibular ENEM e Certificações", "s": "Bolsa 50% — modalidade ENEM", "i": "Exclusiva para a modalidade de ingresso ENEM; candidatos de certificações internacionais (IB/ABITUR/SAT/BAC) não concorrem. Requisitos cumulativos: ser 1º lugar em ordem decrescente de nota ENEM na unidade escolhida (Campinas, Araras, Limeira ou Arcoverde) e média ENEM ≥ 650 (média das 5 áreas). Concedida aos 1ºs colocados de cada Faculdade em cada quinzena de convocação, de 28/08/26 a 25/01/27. Se as vagas se esgotarem antes, a captação/concessão pode ser interrompida. Sem reavaliação em quinzenas seguintes se o candidato não for o 1º colocado na quinzena avaliada.", "r": "No Vestibular de Medicina 2027.1-A (ENEM e Certificações Internacionais), a bolsa é de 50% de desconto na mensalidade, exclusiva para quem concorre pela modalidade ENEM.\n\nPara ter direito, é preciso, ao mesmo tempo:\n• Ser o 1º colocado da unidade escolhida (Campinas, Araras, Limeira ou Arcoverde);\n• Ter média igual ou superior a 650 pontos no ENEM.\n\nA concessão ocorre a cada quinzena de convocação, entre 28/08/2026 e 25/01/2027.", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "Vestibular Provas (Presencial e On-line)", "s": "Bolsas 50% / 30% / 20% — Provas Presencial e On-line", "i": "80 bolsas no total: 40 na modalidade presencial e 40 na on-line, sendo 10 por Faculdade em cada modalidade. Escalonamento por colocação, em cada Faculdade: 1º lugar = 50%; 2º a 5º = 30%; 6º a 10º = 20%. Critério exclusivamente de desempenho.", "r": "No Vestibular de Medicina 2027.1-A (Provas Presencial e On-line), são 80 bolsas de desconto na mensalidade, distribuídas por desempenho em cada Faculdade:\n• 1º colocado: 50% de desconto;\n• 2º ao 5º colocado: 30% de desconto;\n• 6º ao 10º colocado: 20% de desconto.\n\nSão 10 bolsas por Faculdade em cada modalidade (presencial e on-line).", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "Manutenção da bolsa", "s": "Como manter a bolsa durante o curso", "i": "Requisitos de manutenção iguais para os dois vestibulares (ENEM e Provas).", "r": "Para manter a bolsa durante todo o curso, o(a) aluno(a) deve:\n• Exercer atividades de inserção social definidas pela Instituição;\n• Cumprir os regimentos e regulamentos da Instituição;\n• Manter média de notas de no mínimo 7,0;\n• Ter frequência mínima de 75% nas aulas/atividades;\n• Não receber medidas disciplinares por infrações acadêmicas.", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "O que a bolsa não cobre", "s": "O que não está incluído na bolsa", "i": "Exclusões iguais para os dois vestibulares.", "r": "A bolsa é um desconto na mensalidade e não cobre:\n• Taxas de provas substitutivas, reforço, adaptações e classes especiais;\n• Reposições de aula, estágio ou internato;\n• Material didático de uso individual e obrigatório;\n• Equipamentos de proteção individual;\n• Diplomas em material diferenciado;\n• Atividades extracurriculares.\n\nTambém não inclui transporte, moradia ou alimentação.", "sla": ""}, {"g": "Bolsa por Mérito Acadêmico", "m": "Critérios de desempate", "s": "Desempate na concessão da bolsa", "i": "ENEM: maior nota na Redação → maior idade. Provas: maior nota na Redação → maior pontuação em Ciências da Natureza → maior idade.", "r": "Em caso de empate na nota final:\n• Vestibular ENEM: prevalece a maior nota na Redação e, persistindo, a maior idade.\n• Vestibular de Provas: prevalece a maior nota na Redação, depois a maior pontuação em Ciências da Natureza e, por fim, a maior idade.", "sla": ""}, {"g": "Fluxos e Comunicação", "m": "Comunicação oficial", "s": "Prazos e canais", "i": "Simples: 5 dias úteis. Excepcionais: confirmação em 5 dias, parecer sem prazo. Comunicação oficial: e-mail institucional. Ligas: reserva de sala somente pelo professor responsável (Estatuto jan/2025).", "r": "Prazo para retorno: até 5 dias úteis (casos simples). Comunicações oficiais por e-mail institucional.", "sla": "5 Dias Úteis"}, {"g": "Avaliações", "m": "Sistema de avaliação", "s": "Formativa vs Somativa / Cálculo de média", "i": "Formativas: TBL, apresentações, atitudinais (compõem N1/N2). Somativas: P1, P2 (presenciais).\nMédia = (N1+N2)÷2 + Bônus TP (0-0,5). Exame Final: freq ≥75% E média 3,0-6,9.", "r": "Média final = (N1 + N2) ÷ 2 + bônus TP (até 0,5). Exame Final: frequência ≥ 75% e média entre 3,0 e 6,9.", "sla": ""}, {"g": "Avaliações", "m": "Revisão de prova", "s": "Prazos e procedimento", "i": "5 dias corridos após devolutiva, e-mail ao coordenador c/c Apoio. 1º/2º: plataforma. 3º-8º: presencial. PRA/Faltosos: 5 dias após lançamento. TP: formulário presencial. Fora prazo = indeferido.", "r": "Revisão: e-mail ao coordenador (c/c Apoio) em até 5 dias corridos após devolutiva. Fora do prazo = indeferido.", "sla": "5 Dias"}, {"g": "Avaliações", "m": "Conflito de provas", "s": "DP vs módulo regular", "i": "P1/P2: prioridade módulo regular, aluno avisa coordenador DP. PRA/Faltosos/Exame: Apoio direciona sala conjunta. Máx 2 provas/noite.", "r": "Prova do módulo regular tem prioridade. Conflito com DP: comunique o coordenador ou procure o Apoio.", "sla": ""}, {"g": "Avaliações", "m": "Progressão", "s": "Limite de carga horária pendente", "i": "CH pendente ≤ 240h = pode progredir. Exceção: 8º→9º = nenhuma pendência.", "r": "Progressão possível se CH pendente ≤ 240h. Do 8º para o 9º período, todas as pendências devem estar resolvidas.", "sla": ""}, {"g": "PRA e Faltosos", "m": "Regras gerais", "s": "Critérios, taxa e nota", "i": "PRA: N1 ≤ 6,99 + inscrição no prazo. Máx 3 módulos/sem. Taxa única (teórica+prática), não cancelável. PRA substitui P1 somente se maior (máx 7,0). Taxa apenas PRA/Faltosos.", "r": "PRA: média N1 ≤ 6,99, máx 3 módulos/semestre. Taxa única e não cancelável. Substitui P1 apenas se nota maior (máx 7,0).", "sla": ""}, {"g": "Teste do Progresso (TP)", "m": "Bonificação", "s": "Regras", "i": "Semestral, 120 questões, 6 áreas. Até 0,5 pt (coletiva 0,2 + individual 0,3). Sem substitutiva. Não se aplica a DP. 1º-8º: média módulo. 9º-12º: nota rotação Internato.", "r": "TP pode somar até 0,5 pt na média. Não obrigatório, sem substitutiva em caso de falta.", "sla": ""}, {"g": "Frequência", "m": "Limite de faltas", "s": "Regras por ano", "i": "1º-4º: 25% faltas, sem reposição, desempenho não compensa. Internato (5º/6º): sem tolerância, cada ausência = perda nota + reposição obrigatória.", "r": "1º-4º ano: limite 25%, sem reposição. Internato: cada ausência impacta nota e exige reposição.", "sla": ""}, {"g": "Estágios", "m": "Tipos e regras", "s": "Voluntário, Eletivo, Extracurricular", "i": "Voluntário: Araras. Eletivo: obrigatório 6º ano. Extracurricular: áreas verdes/férias, formulário 15 dias antes. Residência: COREME Araras (coreme@slmandicararas.edu.br / (19) 3508-0729).", "r": "3 tipos de estágio. Eletivo obrigatório no 6º ano. Residência: COREME Araras (coreme@slmandicararas.edu.br).", "sla": ""}, {"g": "Atividades Complementares", "m": "Regras gerais", "s": "Prazos e carga horária", "i": "240h obrigatórias. Só após ingresso. 7 grupos. Prazos: 1º sem=ago-set; 2º sem=mar-abr seguinte. Fora prazo=não aceito. Sem completar=sem colação.", "r": "240h obrigatórias. Prazos: 1º sem: ago-set; 2º sem: mar-abr do ano seguinte. Sem completar = sem colação de grau.", "sla": ""}, {"g": "Acadêmico", "m": "Projetos de extensão", "s": "Contato para projetos de extensão", "i": "Necessário entrar em contato diretamente com a Prof.ª Ivana Daniela Cesar.", "r": "Para tratar de projetos de extensão, é necessário entrar em contato diretamente com a Prof.ª Ivana Daniela Cesar, pelo e-mail:\nivana.cesar@slmandic.edu.br", "sla": ""}, {"g": "Financeiro", "m": "Bolsas", "s": "Super Bolsa", "i": "Verificar informações com Rosiane de Fátima Zaneti, do setor de Contas a Pagar.", "r": "", "sla": ""}, {"g": "Estágios", "m": "Residência", "s": "Contatos COREME por unidade", "i": "Contatos da COREME para questões de residência médica por unidade.", "r": "Segue o contato da COREME conforme a unidade:\n\n• Araras: coreme@slmandicararas.edu.br\n• Medicina do Sertão: coreme@medicinadosertao.com.br\n• Campinas: coreme@slmandic.edu.br\n• Limeira: coreme@slmandiclimeira.edu.br", "sla": ""}, {"g": "Avaliações", "m": "Dependência (DP)", "s": "Oferta de disciplina em Dependência", "i": "A instituição organiza a oferta da disciplina de DP (período, turma e turno) conforme a organização acadêmica e a disponibilidade. Pode ser em regime regular ou especial. Frequência mínima de 75%.", "r": "No caso da Dependência do Curso de Medicina, a instituição é responsável por organizar a oferta da disciplina, definindo o período, a turma e o turno de acordo com a organização acadêmica e a disponibilidade de cada oferta.\n\nA Dependência pode ser disponibilizada em regime regular ou em regime especial, com turmas e horários específicos. Por isso, o aluno deve acompanhar a oferta disponibilizada pela instituição e, ao realizar a disciplina, cumprir a carga horária e os critérios acadêmicos estabelecidos, incluindo a frequência mínima de 75%.", "sla": ""}, {"g": "Avaliações", "m": "Banco de questões", "s": "Suporte Medway (banco de questões)", "i": "Contato do suporte da Medway para o banco de questões.", "r": "Segue o contato da equipe de suporte da Medway para o banco de questões:\n\n• E-mail: contato@medway.com.br\n• WhatsApp: (11) 93481-2585", "sla": ""}, {"g": "Atividades Complementares", "m": "Ligas Acadêmicas", "s": "Entrega de formulário de abertura de grupos de estudos (Liga)", "i": "A entrega deve ser feita no Apoio ao Estudante. Verificar antes: formulários e certificados com assinaturas do docente responsável e do presidente da liga (assinaturas do Coordenador Geral das Ligas e do Centro Acadêmico são de responsabilidade interna). Documentos em envelope/saquinho com capa de identificação. Avisar no grupo do Teams da coordenação qual liga já entregou a documentação, para controle.", "r": "A entrega da documentação da Liga deverá ser feita no Apoio ao Estudante.\n\nAntes da entrega, verifique:\n• Os formulários e certificados devem conter as assinaturas do docente responsável pela liga e do presidente da liga;\n• Os documentos devem ser entregues em envelope ou saquinho, com capa de identificação.\n\nDocumentos obrigatórios:\n• Formulário de Renovação Anual\n• Formulário de Fechamento\n• Atas\n• Lista para controle de certificados\n• Certificados", "sla": ""}]}, {"name": "Pós CPS & ARA", "items": [{"g": "Acadêmico", "m": "Convalidação / Aproveitamentos", "s": "Convalidação/Aproveitamento de Estudos", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Acadêmico > (Selecionar o curso: Graduação / Pós) > Convalidação / Aproveitamentos > Convalidação / Aproveitamento de Estudos.\n \nÉ obrigatório anexar a ementa e histórico escolar.\nA convalidação de disciplinas cursadas em outra Instituição serão analisadas caso tenham sido cursadas em prazo inferior a 4 anos e que sejam do mesmo nível do curso atual.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps itações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "15 Dias Úteis", "i": ""}, {"g": "Comitê de ética", "m": "Comitê de ética", "s": "Assinatura da Declaração para Formação de Biorrepositório", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Comitê de Ética > (Selecionar o curso: Graduação / Pós) > Comitê de Ética > Assinatura da Declaração para Formação de Biorrepositório.\n \n A previsão para finalização da solicitação são de 7 dias úteis.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "7 Dias Úteis", "i": ""}, {"g": "Financeiro", "m": "Reembolso", "s": "Dados necessários para reembolso", "i": "Não realizamos depósitos em conta jurídica, conta de terceiros ou por PIX. Coletar todos os dados abaixo antes de encaminhar ao financeiro/contas a pagar.", "r": "Para darmos andamento ao seu reembolso, por gentileza nos envie os seguintes dados:\n\n• Nome do aluno(a)/candidato(a):\n• Nome do responsável financeiro:\n• CPF do responsável financeiro:\n• Banco:\n• Número da agência:\n• Número da conta:\n• Tipo de conta: corrente ou poupança\n\n⚠️ Importante: não realizamos depósitos em conta jurídica, conta de terceiros ou por PIX.", "sla": ""}, {"g": "Financeiro", "m": "Notas fiscais", "s": "Emissão de nota fiscal", "i": "A Nota Fiscal só pode ser emitida após o início da prestação dos serviços, ou seja, após o início das aulas. Para cursos que ainda não iniciaram, a emissão não pode ser realizada.", "r": "A Nota Fiscal somente pode ser emitida após o início da prestação dos serviços, ou seja, após o início das aulas.\n\nPortanto, para cursos que ainda não foram iniciados, a emissão não poderá ser realizada.", "sla": ""}, {"g": "Financeiro", "m": "Notas fiscais", "s": "Contato para notas fiscais", "i": "O atendimento de notas fiscais é realizado por e-mail: faturamento.slm@slmandic.edu.br", "r": "O atendimento referente a notas fiscais é realizado por e-mail, através do endereço:\nfaturamento.slm@slmandic.edu.br", "sla": ""}, {"g": "Acadêmico", "m": "Diploma / Certificado", "s": "Confirmação de assinatura do diploma (autenticidade)", "i": "Cartório onde os assinantes do diploma têm firma aberta: Cartório Santa Cruz - Oficial de Registro Civil, 2º Subdistrito da Comarca de Campinas/SP.", "r": "Para confirmar a assinatura do diploma e garantir sua autenticidade, o cartório onde os assinantes têm firma aberta é:\n\nCartório Santa Cruz - Oficial de Registro Civil\n2º Subdistrito da Comarca de Campinas/SP\nTel: (19) 2514-2100\nEndereço: Rua Delfino Cintra, 404, Centro — CEP 13020-100, Campinas/SP\n\nE-mails:\n• Principal: campinas2@cartoriosantacruz.com.br\n• Procuração: procuracao@cartoriosantacruz.com.br\n• Apostilamento: apostila@cartoriosantacruz.com.br", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "Acesso ao Portal de Periódicos da CAPES", "i": "Acesso via CAFe. Sigla da instituição: FSLM. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "Para acessar o Portal de Periódicos da CAPES:\n\n1. Acesse: https://www.periodicos.capes.gov.br/\n2. Selecione a opção Acesso CAFe.\n3. Informe a sigla da instituição: FSLM\n4. Use o login e a senha que você utiliza para acessar o Portal do Aluno. 😊\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "UpToDate", "i": "Plataforma de informação em saúde para síntese de conhecimentos, com tópicos de diversas especialidades médicas, textos, gráficos, resumos, referências, vídeos e banco de dados de medicamentos. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "O UpToDate é uma plataforma de informação na área da saúde dedicada à síntese de conhecimentos para uso de médicos e pacientes. Abrange diversos tópicos em diferentes especialidades médicas e inclui textos, gráficos, resumos, referências, vídeos e um banco de dados de medicamentos.\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "App SophiA Biblioteca", "i": "Versão mobile do catálogo online do SophiA Biblioteca. Passo a passo de instalação e acesso em slmandic.edu.br/biblioteca/tecnologia.", "r": "A Biblioteca da Faculdade São Leopoldo Mandic disponibiliza a versão mobile do catálogo online, o app SophiA Biblioteca.\n\nPelo aplicativo você acessa, no seu smartphone ou tablet, informações atualizadas dos seus empréstimos, podendo renová-los, além de realizar e cancelar reservas.\n\nPasso a passo de instalação e acesso disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Financeiro", "m": "Inadimplência", "s": "Inadimplência e bloqueio de acesso", "i": "O sistema bloqueia o acesso automaticamente 1 dia após o vencimento da pendência e envia lembrete 1 dia antes do vencimento. O acesso é normalizado somente após a regularização do débito. Conduzir esse tipo de situação de forma discreta e acolhedora, preservando a privacidade do estudante.", "r": "Lamentamos sinceramente que essa situação tenha causado qualquer tipo de constrangimento.\n\nCom relação ao bloqueio de acesso, informamos que nosso sistema está parametrizado para realizá-lo automaticamente um dia após o vencimento da pendência. Da mesma forma, o sistema encaminha um lembrete um dia antes da data de vencimento, como forma de auxiliar no acompanhamento da regularização.\n\nO acesso é normalizado somente após a regularização do débito. Por esse motivo, a orientação é de que seria necessário verificar e regularizar a situação junto ao setor financeiro antes de retornar às atividades acadêmicas.\n\nAgradecemos por compartilhar sua percepção conosco.", "sla": ""}, {"g": "Acadêmico", "m": "Bases e plataformas", "s": "Orientações sobre o Dental Go", "i": "Biblioteca digital com mais de 6.000 artigos, entrevistas, vídeos, e-books, revistas e aulas. Login: e-mail cadastrado no sistema acadêmico. Senha padrão: slmandic.", "r": "O Dental Go é uma biblioteca digital com mais de 6.000 artigos, entrevistas, vídeos, e-books, revistas e aulas.\n\n• Acesse: dentalgo.com.br\n• Login: utilize o e-mail cadastrado no sistema acadêmico da Mandic.\n• Senha padrão: slmandic", "sla": ""}, {"g": "Acadêmico", "m": "Módulo Mandic", "s": "O que é o Módulo Mandic e principais dúvidas", "i": "Módulo obrigatório da matriz curricular da especialização, necessário para a conclusão do curso. Reúne 4 disciplinas práticas de 8h: (a) Radiologia e Imaginologia para Diagnóstico; (b) Gestão Aplicada a Consultórios e Clínicas Odontológicas; (c) Fotografia Odontológica Aplicada ao Diagnóstico e Registro de Casos Clínicos; (d) Inteligência Artificial Aplicada à Gestão do Consultório e de Pacientes. Reposição: 1ª gratuita (desde que compareça); a partir da 2ª solicitação sem comparecimento há cobrança. Solicitação de reposição pelo Portal do Aluno.\n\nReposição (interno): acessar o cadastro do aluno no TOTVS, campo 'Ocorrências do Aluno', onde ficam registradas as reprovações no Módulo Mandic. Orientar o aluno sobre a disciplina reprovada, enviar o calendário com as datas de reposição, orientar o preenchimento do requerimento manual e a entrega presencial na secretaria da unidade.", "r": "O Módulo Mandic reúne disciplinas práticas que impactam diretamente o seu dia a dia profissional. É obrigatório e faz parte da matriz curricular da especialização.\n\nSão 4 disciplinas de 8 horas cada:\n• Radiologia e Imaginologia para Diagnóstico\n• Gestão Aplicada a Consultórios e Clínicas Odontológicas\n• Fotografia Odontológica Aplicada ao Diagnóstico e Registro de Casos Clínicos\n• Inteligência Artificial Aplicada à Gestão do Consultório e de Pacientes\n\nPrincipais dúvidas:\n• É obrigatório? Sim, é necessário para a conclusão do curso.\n• Existe reposição? Sim. As datas podem ser consultadas junto ao Apoio ao Estudante.\n• A reposição tem custo? A primeira reposição é gratuita, desde que o aluno compareça à aula. A cobrança ocorre a partir da segunda solicitação sem comparecimento.\n• Como solicitar? A solicitação deve ser feita diretamente pelo Portal do Aluno.", "sla": ""}, {"g": "Acadêmico", "m": "Módulo Mandic", "s": "Reposição do Módulo Mandic - Exclusivo SP", "i": "Exclusivo SP: são 3 módulos em 1, mas as reposições são feitas separadamente por módulo, para não prejudicar o aluno. Se o aluno perde 1 dia de um determinado módulo, pode repor depois em uma das datas previstas (conforme calendário/imagem enviada à unidade).", "r": "", "sla": ""}, {"g": "Financeiro", "m": "Descontos", "s": "Desconto não aparece no boleto", "i": "Quando o aluno não consegue visualizar o desconto, orientar a baixar o boleto, pois assim aparece o valor atualizado já com o desconto.", "r": "Quando o desconto não aparece na tela, basta baixar o boleto: nele o valor já é exibido atualizado, com o desconto aplicado. 😊", "sla": ""}]}, {"name": "Pós Unidades", "items": [{"g": "Acadêmico", "m": "Convalidação / Aproveitamentos", "s": "Convalidação/Aproveitamento de Estudos", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Acadêmico > (Selecionar o curso: Graduação / Pós) > Convalidação / Aproveitamentos > Convalidação / Aproveitamento de Estudos.\n \nÉ obrigatório anexar a ementa e histórico escolar.\nA convalidação de disciplinas cursadas em outra Instituição serão analisadas caso tenham sido cursadas em prazo inferior a 4 anos e que sejam do mesmo nível do curso atual.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "10 Dias Úteis", "i": ""}, {"g": "Acadêmico", "m": "Dados cadastrais", "s": "Alteração do responsável acadêmico", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Acadêmico > (Selecionar o curso: Graduação / Pós) > Dados cadastrais > Alteração do responsável acadêmico.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "10 Dias Úteis", "i": ""}, {"g": "Acadêmico", "m": "Dados cadastrais", "s": "Alteração dados cadastrais", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Acadêmico > (Selecionar o curso: Graduação / Pós) > Dados cadastrais > Alteração dados cadastrais.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplic
