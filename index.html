ar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "2 Dias Úteis", "i": ""}, {"g": "Comitê de ética", "m": "Comitê de ética", "s": "Solicitação de dispensa do CEP", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Comitê de Ética > (Selecionar o curso: Graduação / Pós) > Comitê de Ética > Solicitação de dispensa do CEP.\n \nO prazo para emissão do certificado de dispensa são de 15 dias a partir do recebimento do projeto pelo CEP.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "15 Dias Úteis", "i": ""}, {"g": "Comitê de ética", "m": "Comitê de ética", "s": "Assinatura da Declaração para Formação de Biorrepositório", "r": "Você deve acessar o Portal do Aluno na Aba: Urls Externas > CONECTA.\n \nAo acessar o Conecta, você deve ir em Enviar uma Solicitação: Comitê de Ética > (Selecionar o curso: Graduação / Pós) > Comitê de Ética > Assinatura da Declaração para Formação de Biorrepositório.\n \n A previsão para finalização da solicitação são de 7 dias úteis.\n \nPara acompanhar sua solicitação, você deve selecionar a Aba: Solicitações, ela fica no ícone da sua foto/login.\n \nPortal do Aluno\nLink: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n \nAplicativo SLMandic\nLink (Android):\nhttps://play.google.com/store/apps/details?id=br.edu.slmandic.app\nLink (IOS):\nhttps://apps.apple.com/br/app/slmandic/id1573777391", "sla": "7 Dias Úteis", "i": ""}, {"g": "Financeiro", "m": "Reembolso", "s": "Dados necessários para reembolso", "i": "Não realizamos depósitos em conta jurídica, conta de terceiros ou por PIX. Coletar todos os dados abaixo antes de encaminhar ao financeiro/contas a pagar.", "r": "Para darmos andamento ao seu reembolso, por gentileza nos envie os seguintes dados:\n\n• Nome do aluno(a)/candidato(a):\n• Nome do responsável financeiro:\n• CPF do responsável financeiro:\n• Banco:\n• Número da agência:\n• Número da conta:\n• Tipo de conta: corrente ou poupança\n\n⚠️ Importante: não realizamos depósitos em conta jurídica, conta de terceiros ou por PIX.", "sla": ""}, {"g": "Financeiro", "m": "Notas fiscais", "s": "Emissão de nota fiscal", "i": "A Nota Fiscal só pode ser emitida após o início da prestação dos serviços, ou seja, após o início das aulas. Para cursos que ainda não iniciaram, a emissão não pode ser realizada.", "r": "A Nota Fiscal somente pode ser emitida após o início da prestação dos serviços, ou seja, após o início das aulas.\n\nPortanto, para cursos que ainda não foram iniciados, a emissão não poderá ser realizada.", "sla": ""}, {"g": "Financeiro", "m": "Notas fiscais", "s": "Contato para notas fiscais", "i": "O atendimento de notas fiscais é realizado por e-mail: faturamento.slm@slmandic.edu.br", "r": "O atendimento referente a notas fiscais é realizado por e-mail, através do endereço:\nfaturamento.slm@slmandic.edu.br", "sla": ""}, {"g": "Acadêmico", "m": "Diploma / Certificado", "s": "Confirmação de assinatura do diploma (autenticidade)", "i": "Cartório onde os assinantes do diploma têm firma aberta: Cartório Santa Cruz - Oficial de Registro Civil, 2º Subdistrito da Comarca de Campinas/SP.", "r": "Para confirmar a assinatura do diploma e garantir sua autenticidade, o cartório onde os assinantes têm firma aberta é:\n\nCartório Santa Cruz - Oficial de Registro Civil\n2º Subdistrito da Comarca de Campinas/SP\nTel: (19) 2514-2100\nEndereço: Rua Delfino Cintra, 404, Centro — CEP 13020-100, Campinas/SP\n\nE-mails:\n• Principal: campinas2@cartoriosantacruz.com.br\n• Procuração: procuracao@cartoriosantacruz.com.br\n• Apostilamento: apostila@cartoriosantacruz.com.br", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "Acesso ao Portal de Periódicos da CAPES", "i": "Acesso via CAFe. Sigla da instituição: FSLM. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "Para acessar o Portal de Periódicos da CAPES:\n\n1. Acesse: https://www.periodicos.capes.gov.br/\n2. Selecione a opção Acesso CAFe.\n3. Informe a sigla da instituição: FSLM\n4. Use o login e a senha que você utiliza para acessar o Portal do Aluno. 😊\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "UpToDate", "i": "Plataforma de informação em saúde para síntese de conhecimentos, com tópicos de diversas especialidades médicas, textos, gráficos, resumos, referências, vídeos e banco de dados de medicamentos. Passo a passo de instalação em slmandic.edu.br/biblioteca/tecnologia.", "r": "O UpToDate é uma plataforma de informação na área da saúde dedicada à síntese de conhecimentos para uso de médicos e pacientes. Abrange diversos tópicos em diferentes especialidades médicas e inclui textos, gráficos, resumos, referências, vídeos e um banco de dados de medicamentos.\n\nPasso a passo de instalação disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Biblioteca", "m": "Bases e plataformas", "s": "App SophiA Biblioteca", "i": "Versão mobile do catálogo online do SophiA Biblioteca. Passo a passo de instalação e acesso em slmandic.edu.br/biblioteca/tecnologia.", "r": "A Biblioteca da Faculdade São Leopoldo Mandic disponibiliza a versão mobile do catálogo online, o app SophiA Biblioteca.\n\nPelo aplicativo você acessa, no seu smartphone ou tablet, informações atualizadas dos seus empréstimos, podendo renová-los, além de realizar e cancelar reservas.\n\nPasso a passo de instalação e acesso disponível em:\nhttps://slmandic.edu.br/biblioteca/tecnologia", "sla": ""}, {"g": "Financeiro", "m": "Inadimplência", "s": "Inadimplência e bloqueio de acesso", "i": "O sistema bloqueia o acesso automaticamente 1 dia após o vencimento da pendência e envia lembrete 1 dia antes do vencimento. O acesso é normalizado somente após a regularização do débito. Conduzir esse tipo de situação de forma discreta e acolhedora, preservando a privacidade do estudante.", "r": "Lamentamos sinceramente que essa situação tenha causado qualquer tipo de constrangimento.\n\nCom relação ao bloqueio de acesso, informamos que nosso sistema está parametrizado para realizá-lo automaticamente um dia após o vencimento da pendência. Da mesma forma, o sistema encaminha um lembrete um dia antes da data de vencimento, como forma de auxiliar no acompanhamento da regularização.\n\nO acesso é normalizado somente após a regularização do débito. Por esse motivo, a orientação é de que seria necessário verificar e regularizar a situação junto ao setor financeiro antes de retornar às atividades acadêmicas.\n\nAgradecemos por compartilhar sua percepção conosco.", "sla": ""}, {"g": "Acadêmico", "m": "Bases e plataformas", "s": "Orientações sobre o Dental Go", "i": "Biblioteca digital com mais de 6.000 artigos, entrevistas, vídeos, e-books, revistas e aulas. Login: e-mail cadastrado no sistema acadêmico. Senha padrão: slmandic.", "r": "O Dental Go é uma biblioteca digital com mais de 6.000 artigos, entrevistas, vídeos, e-books, revistas e aulas.\n\n• Acesse: dentalgo.com.br\n• Login: utilize o e-mail cadastrado no sistema acadêmico da Mandic.\n• Senha padrão: slmandic", "sla": ""}, {"g": "Acadêmico", "m": "Módulo Mandic", "s": "O que é o Módulo Mandic e principais dúvidas", "i": "Módulo obrigatório da matriz curricular da especialização, necessário para a conclusão do curso. Reúne 4 disciplinas práticas de 8h: (a) Radiologia e Imaginologia para Diagnóstico; (b) Gestão Aplicada a Consultórios e Clínicas Odontológicas; (c) Fotografia Odontológica Aplicada ao Diagnóstico e Registro de Casos Clínicos; (d) Inteligência Artificial Aplicada à Gestão do Consultório e de Pacientes. Reposição: 1ª gratuita (desde que compareça); a partir da 2ª solicitação sem comparecimento há cobrança. Solicitação de reposição pelo Portal do Aluno.\n\nReposição (interno): acessar o cadastro do aluno no TOTVS, campo 'Ocorrências do Aluno', onde ficam registradas as reprovações no Módulo Mandic. Orientar o aluno sobre a disciplina reprovada, enviar o calendário com as datas de reposição, orientar o preenchimento do requerimento manual e a entrega presencial na secretaria da unidade.", "r": "O Módulo Mandic reúne disciplinas práticas que impactam diretamente o seu dia a dia profissional. É obrigatório e faz parte da matriz curricular da especialização.\n\nSão 4 disciplinas de 8 horas cada:\n• Radiologia e Imaginologia para Diagnóstico\n• Gestão Aplicada a Consultórios e Clínicas Odontológicas\n• Fotografia Odontológica Aplicada ao Diagnóstico e Registro de Casos Clínicos\n• Inteligência Artificial Aplicada à Gestão do Consultório e de Pacientes\n\nPrincipais dúvidas:\n• É obrigatório? Sim, é necessário para a conclusão do curso.\n• Existe reposição? Sim. As datas podem ser consultadas junto ao Apoio ao Estudante.\n• A reposição tem custo? A primeira reposição é gratuita, desde que o aluno compareça à aula. A cobrança ocorre a partir da segunda solicitação sem comparecimento.\n• Como solicitar? A solicitação deve ser feita diretamente pelo Portal do Aluno.", "sla": ""}, {"g": "Acadêmico", "m": "Módulo Mandic", "s": "Reposição do Módulo Mandic - Exclusivo SP", "i": "Exclusivo SP: são 3 módulos em 1, mas as reposições são feitas separadamente por módulo, para não prejudicar o aluno. Se o aluno perde 1 dia de um determinado módulo, pode repor depois em uma das datas previstas (conforme calendário/imagem enviada à unidade).", "r": "", "sla": ""}, {"g": "Financeiro", "m": "Descontos", "s": "Desconto não aparece no boleto", "i": "Quando o aluno não consegue visualizar o desconto, orientar a baixar o boleto, pois assim aparece o valor atualizado já com o desconto.", "r": "Quando o desconto não aparece na tela, basta baixar o boleto: nele o valor já é exibido atualizado, com o desconto aplicado. 😊", "sla": ""}, {"g": "Acadêmico", "m": "Canais de atendimento", "s": "Mestrado em Arcoverde - canal de atendimento", "i": "O Mestrado em Arcoverde utiliza o Conecta como canal de solicitações.", "r": "", "sla": ""}]}, {"name": "Pós Médica", "items": [{"g": "Acadêmico", "m": "Transferência interna", "s": "Transferência de curso", "i": "Acessar o Totvs, verificar quantas parcelas o aluno já pagou; Acessar planilha de valores do curso e verificar o valor total do novo curso e máximo de parcelamento, subtrair o valor total pago pelo aluno do valor total do novo curso, dividir as parcelas e informar o valor ao aluno. Caso o aluno aceite, seguir com o processo de troca de turma. Abrir conversa paralela e colocar a macro de Transferência interna; No assunto do e-mail informar nome do aluno e RA, no corpo do e-mail informar corretamente o atual curso e DI e o novo curso e DI para o qual o aluno será transferido, além disso é imprescindível informar o novo plano de pagamento.", "r": "Dr (a) solicitei sua transferência de curso, o prazo para conclusão é de 10 dias úteis, você receberá seu novo contrato por e-mail.", "sla": "10 Dias Úteis"}, {"g": "Acadêmico", "m": "Emissões de documentos", "s": "Declaração de Conclusão de curso", "i": "Analisar no Totvs se todas as notas e aprovações estão lançadas, em caso positivo, transferir o ticket para N2 secretaria (imprescindível preencher o formulário Requerimentos Pós Médica); Caso as presenças e aprovações não estejam lançadas, verificar a unidade do aluno e solicitar para o responsável pelo Relacionamento docente da unidade.", "r": "Dr (a) solicitamos o documento solicitado, o prazo para envio é de 5 dias úteis. Assim que estiver confeccionado, entrarei em contato com você através desse canal.", "sla": "5 Dias Úteis"}, {"g": "Acadêmico", "m": "Emissões de documentos", "s": "Declaração de Frequência / Faltas", "i": "Analisar no Totvs se todas as notas e aprovações estão lançadas, em caso positivo, transferir o ticket para N2 secretaria (imprescindível preencher o formulário Requerimentos Pós Médica); Caso as presenças e aprovações não estejam lançadas, verificar a unidade do aluno e solicitar para o responsável pelo Relacionamento docente da unidade.", "r": "Dr (a) solicitamos o documento solicitado, o prazo para envio é de 5 dias úteis. Assim que estiver confeccionado, entrarei em contato com você através desse canal.", "sla": "5 Dias Úteis"}, {"g": "Acadêmico", "m": "Emissões de documentos", "s": "Declaração de Matrícula PÓS", "i": "", "r": "Você pode emitir sua Declaração de Matrícula diretamente no Portal do Aluno, seguindo este caminho:\nRelatórios > Declaração de Vínculo\n\nA emissão é imediata, e você poderá salvar o documento em PDF.\n\n\n🔗 Acessar Portal do Aluno:\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": ""}, {"g": "Acadêmico", "m": "Envio de Documentos", "s": "Documentos Pessoais", "i": "", "r": "Acesse seu Portal do aluno, depois no canto superior direito, expanda o menu e selecione \n“Cadastro Acadêmico.”\nVocê deve selecionar a aba “Documentos” e anexa seus documentos em formato PDF.", "sla": ""}, {"g": "Acadêmico", "m": "Reposição de aula", "s": "Reposição de módulo", "i": "Verificar no Totvs se na disciplina o aluno aparece como reprovado, após isso informar o aluno sobre o valor da reposição do módulo (se for a primeira reposição é gratuita); Verificar nos cronogramas qual turma tem a disciplina que o aluno irá repor, informá-lo da data e informar também à concierge da unidade e ao time de relacionamento docente (por e-mail e via planilha de controle das concierges).", "r": "Sua reposição de aula foi agendada com sucesso, conforme os dados abaixo:\n• Turma de origem:\n• Turma de reposição: \n• Data: \n• Módulo:", "sla": ""}, {"g": "Acadêmico", "m": "Frequências e faltas", "s": "", "i": "", "r": "Você tem direito a faltar até 25% do módulo, isso significa que se você faltar uma aula online apenas e até 1 dia do presencial, não reprova o módulo, mas se faltar dois dias do presencial ou então 2 aulas online é necessário repor todas as aulas pois não atinge a quantidade mínima de frequência exigida por módulo, que é 75%. \n\nCaso reprove no módulo, você tem direito a uma reposição gratuita, as demais são cobradas.", "sla": ""}, {"g": "Acadêmico:", "m": "Avaliações", "s": "Provas e TCC", "i": "", "r": "A pós-graduação não possui provas nem trabalho de conclusão. A aprovação é baseada na presença nas aulas (presenciais e online) e na avaliação do professor durante as atividades práticas.", "sla": ""}, {"g": "Acadêmico:", "m": "Conclusão do curso", "s": "Diploma/Certificado de conclusão", "i": "Verificar no totvs se o aluno consta como aprovado em todas as disciplinas, caso tenha mais de 30 dias da conclusão do curso, acionar o time de Relacionamento docente para que eles informem o prazo para ajuste das aprovações.", "r": "Após a conclusão, ocorre o fechamento da portaria do curso e validação com o conselho (a validação ocorre em uma reunião bimestral). Finalizado este processo, o certificado entra em processo de emissão e assinatura, contando prazo de 90 dias úteis.\n\nQuando finalizado, será encaminhado ao seu e-mail :)", "sla": ""}, {"g": "Acadêmico", "m": "Cancelamento de cursos", "s": "Sol. de Cancelamento de Matrícula", "i": "Perguntar ao aluno o motivo da solicitação de cancelamento, passar as condições de cancelamento; É obrigatório preencher corretamente o formulário Requerimentos Pós Médica- Sol. de Cancelamento.", "r": "O boletos vencidos devem ser pagos;\nSe for venda protegida, você pode cancelar até 2 meses após inicio das aulas sem a cobrança da multa;\nA multa gerada são de 10% sobre os boletos a vencer;\nConsidera-se para fins financeiros a data da solicitação;\n \nO valor total da multa é gerado em parcela única, você pode solicitar o parcelamento, porém será realizado a avaliação pelo time de cobranças. Vou transferir seu atendimento para a concierge da sua unidade.", "sla": "20 Dias Úteis"}, {"g": "Financeiro", "m": "Boletos", "s": "Emissão de boleto", "i": "", "r": "Seu boleto já está disponível para emissão diretamente no Portal do Aluno.\n\nPara acessá-lo, siga o passo a passo abaixo:\n\n• Acesse o Portal do Aluno;\n• No canto superior direito, clique na opção “Alterar Curso”;\n• Selecione o curso atual ou, se preferir, tente acessar pelos demais cursos disponíveis;\n• Em seguida, acesse a aba “Financeiro” para verificar a emissão do boleto.\n\n\n\n🔗 Portal do Aluno:\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n\n\n\n🔐 Acesso:\nSeu login é o RA e a senha padrão é slmaluno 🙂\n\nSe você não souber seu login, você consegue visualizar ele no seu crachá da Mandic, ou pode me informar seu CPF que eu te ajudo com isso, ok? 💬\n\n\n\nCaso você não consiga baixar o boleto, certifique-se de que o pop-up está permitido. E como fazer isso: \n \nGoogle Chrome: \n \n1. Acesse o navegador Google Chrome no seu computador/celular. \n2. Clique no menu do Chrome (os três pontos verticais no canto superior direito) e selecione \"Configurações\".  \n3. No menu lateral, clique em \"Privacidade e segurança\". \n4. Em seguida, clique em \"Configurações do site\". \n5. Localize a seção \"Pop-ups e redirecionamentos\". \n6. Escolha a configuração: Selecione a opção \"Permitir que todos os sites exibam pop-ups\" ou adicione exceções para sites específicos que você deseja permitir que mostrem pop-ups. \n \nSafari: \n \n1. Localize e abra o aplicativo Ajustes no seu dispositivo. \n2. Role para baixo e toque em Safari. \n3. Localize a opção Bloquear Pop-ups e desative-a", "sla": ""}, {"g": "Financeiro", "m": "Boletos", "s": "Alteração de data de vencimento", "i": "Enviar e-mail via conversa paralela para o financeiro (utilizar macro Alteração de vencimento de boleto), informando a data que será alterado, nome completo do aluno e RA.", "r": "Solicitamos a alteração de vencimento do boleto, a atualização será a partir do próximo mês.", "sla": "2 Dias Úteis"}, {"g": "Financeiro", "m": "Contrato", "s": "Solicitação de alteração de responsável financeiro", "i": "Solicitar para o financeiro (via planilha de solicitação) e o financeiro irá enviar um novo contrato para assinatura do responsável financeiro.", "r": "", "sla": "10 Dias Úteis"}, {"g": "Portal do Aluno", "m": "Dados de acesso", "s": "", "i": "Conultar aluno no Totvs, e copiar o número do RA dele, a senha padrão é slmaluno", "r": "Seus dados de acesso foram enviados no e-mail cadastrado no ato da matrícula. \n\nMas vou te enviar novamente por aqui. \n\nRA: \nSenha: slmaluno\n\nEsses dados você usará para acessar tudo na Mandic!  \n\n\n\nAulas online: A plataforma é a Blackboard, onde você poderá assistir às gravações das aulas e acessar todos os conteúdos disponibilizados pelos professores. 📚💻 \n\n \n\nLink de acesso à Blackboard: https://slmandic.blackboard.com/webapps/login/\n\nO acesso será liberado quando suas aulas começarem. O link das aulas será enviado através do grupo de WhatsApp, cujo convite você receberá em brave, caso ainda não tenha recebido.\n\n\n\nFinanceiro (boletos):  \n\nNo portal você irá consultar seus boletos e gerar o código de barras para pagamento.  \n\nPortal do Aluno:\n\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": ""}, {"g": "Carteirinha do estudante", "m": "Carteirinha do estudante", "s": "", "i": "", "r": "Não emitimos carteirinha de estudante, mas posso solicitar a confecção da declaração de matrícula para você. Com ela, é possível solicitar a Carteirinha Nacional de Estudante (DNE) diretamente no site oficial, e a versão online costuma ficar pronta no mesmo dia.\n \nSite: Documento Nacional do Estudante", "sla": ""}, {"g": "Horários", "m": "Aulas online", "s": "horário da aula online e orientações", "i": "", "r": "Aula online:\n\n🕢 Horário: 19h30 (horário de Brasília).\n\n\n💻 A plataforma utilizada será o Zoom.\n\nMinha dica é: baixe o aplicativo com antecedência, para garantir um acesso mais tranquilo no dia da aula. 🙃\n\n\n\n📱 Posso assistir pelo celular?\n\n➡️ Pode sim! Porém, não recomendo, pois a visualização e a interação ficam mais limitadas pelo tamanho da tela. Se possível, priorize computador ou notebook.\n\n\n\n📝 Teremos lista de presença?\n\n➡️ Sim! A presença será contabilizada de acordo com o tempo de permanência na aula.\n\nPor isso, é fundamental acessar o Zoom com nome e sobrenome, para que o time consiga identificar você corretamente.\n\n\nCaso queira assistir às aulas depois, acesse o Blackboard: https://slmandic.blackboard.com/webapps/login/\n\n✨ Lembrete importante: assistir à gravação não contabiliza presença. Para garantir sua participação, é essencial estar ao vivo, no horário da aula.\n\n\n\nO link da aula será enviado no grupo da turma!", "sla": ""}, {"g": "Pós Online", "m": "Aulas práticas", "s": "Aulas opcionais", "i": "O aluno de pós online tem direito a fazer duas aulas práticas presenciais na unidade. Para agendar é necessário verificar o cronograma do aluno e verificar se há alguma turma presencial que irá fazer aquelas aulas, depois passar as datas para o aluno.", "r": "Você tem direito a realizar até 2 dias de aulas práticas no total.\n\nEsses dias podem ser utilizados da forma que for melhor para você: pode escolher 1 dia em um módulo e 1 dia em outro módulo, ou realizar os 2 dias dentro do mesmo módulo.\n\nCaso deseje agendar as práticas, fico à disposição para te orientar.", "sla": ""}, {"g": "Pós Online", "m": "Aulas práticas", "s": "Teleatendimento", "i": "O teleatendimento é a aula prática da pós online, e é obrigatória. \nOcorre a cada 2 meses e o aluno deve estar disponível das 8h às 18h conforme os atendimentos do dia.", "r": "enviar guia do aluno", "sla": ""}, {"g": "Acessos e Plataformas", "m": "Blackboard", "s": "Acesso ainda não liberado (turma nova)", "i": "O acesso ao Blackboard e o onboarding começam cerca de 30 dias antes do início das aulas da turma. Verificar a data de início da turma no Totvs; se faltar mais de 30 dias, informar que os acessos serão enviados pela concierge no onboarding. Não abrir chamado com TI nesses casos.", "r": "Como o seu curso ainda não começou, o acesso à plataforma ainda não foi liberado 😊 Cerca de 30 dias antes do início das aulas sua concierge inicia o onboarding e envia cronograma, acessos e todas as informações do curso. Pode ficar tranquilo(a)! 💙", "sla": ""}, {"g": "Acadêmico", "m": "Cronograma", "s": "Cronograma e datas das aulas", "i": "Localizar o cronograma vigente da turma (pasta da unidade) e enviar em anexo. Confirmar sempre a turma real do aluno no Totvs antes do envio. Alterações de datas são comunicadas no grupo da turma.", "r": "Estou te enviando em anexo o cronograma atualizado da sua turma 🗓️ As aulas online ao vivo acontecem pelo Zoom, às 19h30, e o link é enviado no grupo da turma no dia da aula. Qualquer alteração de data será comunicada no grupo, tá bem? 💙", "sla": ""}, {"g": "Acadêmico", "m": "Matrícula", "s": "Ingresso em turma modular já iniciada", "i": "O curso é modular: o aluno pode ingressar em diferentes momentos da grade e cursar todos os módulos ao longo do cronograma completo, sem prejuízo de carga horária ou certificação. Os módulos anteriores ao ingresso são cursados depois, com turmas seguintes.", "r": "Fique tranquilo(a)! Como nossa pós funciona em formato modular, mesmo entrando depois do início da turma você vai cursar todos os módulos ao longo do cronograma completo — sem prejuízo na carga horária ou na certificação final. Os módulos anteriores à sua entrada são cursados depois, acompanhando outras turmas 💙", "sla": ""}, {"g": "Acadêmico", "m": "Frequências e faltas", "s": "Como a presença é contabilizada / atestado médico", "i": "A presença é computada automaticamente pelo tempo logado na aula ao vivo com o usuário do aluno — não há justificativa de ausência: o atestado médico não abona a falta, serve apenas como justificativa acadêmica. Limite de 25% de faltas (75% de frequência). Orientar reposição da aula/módulo (1ª gratuita, demais pagas).", "r": "A presença é registrada automaticamente pelo tempo em que você permanece logado(a) na aula ao vivo 💻 O atestado médico não abona a falta — ele serve como justificativa acadêmica, mas a frequência mínima de 75% continua valendo. Se precisar faltar, dá pra organizar a reposição da aula/módulo (a primeira é gratuita). Me chama que te ajudo! 💙", "sla": ""}, {"g": "Acadêmico", "m": "Frequências e faltas", "s": "Carga horária mínima por módulo (regra detalhada)", "i": "Faltar 1 aula online e até 1 dia de presencial não reprova o módulo. Faltar 2 dias de presencial OU 2 aulas online não atinge a carga horária mínima do módulo — é necessário repor o módulo inteiro (1ª reposição gratuita, demais cobradas). A frequência de 75% é apurada por módulo: ficar abaixo em um módulo não reprova o curso, mas o módulo consta como não realizado no histórico e impede o diploma até a reposição.", "r": "Deixa eu te explicar certinho: se você faltar em até 1 aula online e 1 dia de presencial, não há prejuízo no módulo. Mas com 2 dias de presencial ou 2 aulas online de falta, a carga horária mínima não é atingida e será necessário repor o módulo completo — a primeira reposição é gratuita 💙 E fique tranquilo(a): ficar abaixo de 75% em um módulo não reprova o curso todo; basta repor o módulo até o final da pós.", "sla": ""}, {"g": "Acadêmico", "m": "Trancamento", "s": "Solicitação de trancamento de matrícula", "i": "O contrato (cláusula 6.1) estabelece que não se admite trancamento do curso contratado. Alternativas: transferência para turma com início futuro ou reposição de módulos. Casos excepcionais de saúde: levar à coordenação para avaliação pontual (exceção caso a caso, não direito contratual). Nunca deixar a solicitação sem retorno.", "r": "Sobre o trancamento: nosso contrato não prevê essa modalidade. O que oferecemos como alternativas são a transferência para uma turma com início futuro (sem perder o investimento já realizado) ou a reposição dos módulos que você não puder acompanhar. Em situações excepcionais, como questões de saúde, posso levar seu caso à coordenação para avaliação. Quer que eu verifique qual opção faz mais sentido pra você? 💙", "sla": ""}, {"g": "Acadêmico", "m": "Afastamento", "s": "Afastamento temporário por questão de saúde", "i": "Não há política formal de afastamento (trancamento não é admitido em contrato). Casos de saúde são tratados como exceção, com autorização da coordenação e prazo de retorno definido caso a caso. Registrar a solicitação, acionar a coordenação e retornar ao aluno com posicionamento e prazo. Orientar o aluno a avisar com antecedência se precisar estender o período.", "r": "Entendo o seu momento e agradeço por nos manter informados. Vou verificar com a coordenação acadêmica a sua situação e como fica o prazo de retorno — te retorno assim que tiver uma resposta, combinado? Se precisar de mais tempo, é importante nos avisar com antecedência para alinharmos 💙", "sla": ""}, {"g": "Acadêmico", "m": "Vínculo", "s": "Vínculo não renovado — retomada de atividades", "i": "Quando o aluno não renova o vínculo no período, as atividades ficam suspensas. Para retomar: autorização do coordenador do curso + pagamento das parcelas em atraso até o mês vigente. A regularização financeira sozinha não restabelece o acesso — a aprovação acadêmica é pré-requisito.", "r": "Identifiquei que seu vínculo não foi renovado no período anterior, por isso suas atividades ficaram temporariamente suspensas. Para retomar, preciso solicitar a autorização do coordenador do seu curso, além da regularização das parcelas em atraso até o mês vigente. Vou dar andamento e te aviso assim que tiver retorno 💙", "sla": ""}, {"g": "Acadêmico", "m": "Transferência interna", "s": "Troca de turma ou unidade", "i": "Confirmar a turma atual real do aluno no Totvs. Verificar disponibilidade de vaga na turma/unidade destino. Realizar a transferência e informar que um novo contrato será enviado por e-mail — a troca só se conclui com a assinatura. Atenção: alguns cursos têm módulo específico realizado em Campinas independente da unidade.", "r": "Claro, consigo te ajudar com a troca! Vou verificar a disponibilidade na turma/unidade desejada e realizar a transferência. Depois disso, você receberá um novo contrato por e-mail — a troca é concluída com a sua assinatura, tá bem? Te aviso assim que estiver tudo certo 💙", "sla": ""}, {"g": "Acadêmico", "m": "Cancelamento de cursos", "s": "Regras de multa e venda protegida", "i": "Boletos vencidos devem ser pagos independentemente do cancelamento. Venda protegida: cancelamento em até 2 meses após o início das aulas sem multa. Fora disso: multa de 10% sobre os boletos a vencer, considerando a data da solicitação. A multa é gerada em parcela única; o parcelamento pode ser solicitado, sujeito à avaliação do time de cobranças.", "r": "Sobre o cancelamento: os boletos já vencidos precisam ser quitados normalmente. Se você tiver o benefício de venda protegida, pode cancelar em até 2 meses após o início das aulas sem multa. Fora desse caso, é cobrada multa de 10% sobre as parcelas a vencer, calculada pela data da sua solicitação. A multa é gerada em parcela única, mas você pode pedir o parcelamento — vou verificar com o time de cobranças 💙", "sla": ""}, {"g": "Acadêmico", "m": "Cancelamento de cursos", "s": "Formulário de desistência (distrato)", "i": "O contrato prevê formulário de desistência como etapa formal do cancelamento. A concierge deve providenciar o formulário e orientar o preenchimento diretamente, evitando encaminhar o aluno entre setores sem solução.", "r": "Vou te enviar o formulário de desistência previsto no seu contrato — é a etapa formal para darmos andamento ao cancelamento. Assim que preencher e devolver, sigo com o processo e te mantenho informado(a) sobre os próximos passos 💙", "sla": ""}, {"g": "Acadêmico", "m": "Conclusão do curso", "s": "Certificado e cláusula de material diferenciado", "i": "O certificado de conclusão é emitido após quitação de todas as mensalidades e reposição dos módulos pendentes. A cláusula contratual sobre 'material diferenciado' não impede a emissão do certificado regular — refere-se apenas a serviços extras da Secretaria (papel especial, 2ª via, versões personalizadas), cobrados à parte.", "r": "Seu certificado de conclusão é emitido assim que todas as mensalidades estiverem quitadas e os módulos pendentes forem repostos ✅ Sobre a cláusula de 'material diferenciado': ela não significa que você não receberá o certificado — refere-se apenas a serviços extras opcionais da Secretaria, como papel especial ou segunda via. O certificado regular é emitido normalmente, sem custo adicional 💙", "sla": ""}, {"g": "Acadêmico", "m": "Experiência", "s": "Jornada Antecipada (visita a um dia de aula)", "i": "Aluno matriculado pode participar de um dia de aula presencial de turma avançada antes do início do curso. Verificar datas disponíveis e unidade (a oferta pode não existir em todas). Confirmar curso e unidade de interesse e agendar. Horário padrão do encontro presencial: 08h às 18h.", "r": "Que legal seu interesse na Jornada Antecipada! 😊 Ela permite que você passe um dia em uma aula presencial de uma turma avançada e sinta a dinâmica da pós antes do seu início. Vou verificar as próximas datas disponíveis para o seu curso e unidade e te retorno com as opções. O encontro acontece das 08h às 18h 💙", "sla": ""}, {"g": "Financeiro", "m": "Boletos", "s": "Primeiro boleto (turma iniciante)", "i": "Confirmar data de início da turma no Totvs. O primeiro vencimento ocorre no mês seguinte ao início das aulas, na data de vencimento contratada. Muitos alunos recém-matriculados questionam por não receber boleto antes do início.", "r": "Pode ficar tranquilo(a)! Como suas aulas ainda vão começar, o seu primeiro boleto terá vencimento apenas no mês seguinte ao início, na data contratada 💙", "sla": ""}, {"g": "Financeiro", "m": "Boletos", "s": "Boleto em duplicidade", "i": "Encaminhar ao financeiro para verificação em sistema. Se o financeiro não localizar duplicidade, solicitar ao aluno os comprovantes de pagamento para conferência cruzada. Não prometer estorno sem confirmação do financeiro.", "r": "Vou verificar com o nosso financeiro se houve lançamento em duplicidade no seu boleto. Assim que tiver a resposta, te retorno! Caso precise, posso pedir o comprovante de pagamento para agilizar a conferência 💙", "sla": ""}, {"g": "Financeiro", "m": "Contrato", "s": "Divergência entre parcelas contratadas e cobradas", "i": "Quando o número de parcelas cobradas diverge do contrato assinado (ex.: contrato 27x, sistema 29x), não resolver na concierge — encaminhar ao financeiro/contratos com o número do contrato. Solicitar ao aluno o registro do contrato assinado antes de escalar.", "r": "Entendo sua preocupação! Como isso envolve a análise do seu contrato assinado, vou encaminhar sua solicitação para o time financeiro verificar a divergência entre o número de parcelas contratado e o que está sendo cobrado. Assim que tiver retorno, te aviso por aqui 💙", "sla": ""}, {"g": "Financeiro", "m": "Negociação", "s": "Negociação de débitos em atraso", "i": "Encaminhar ao time de cobrança para simulação. O acordo pode envolver parcelas em aberto + multa por atraso, com possibilidade de parcelar a multa em até 6x. Confirmar por escrito valores e parcelas do acordo antes do pagamento e registrar isenções/descontos combinados.", "r": "Vou verificar com nosso time financeiro a simulação de negociação para as suas parcelas em atraso. Assim que tiver os valores, te envio o detalhamento do acordo para sua confirmação antes do pagamento 💙", "sla": ""}, {"g": "Financeiro", "m": "Reembolso", "s": "Reembolso de despesas de viagem (aula presencial)", "i": "Solicitar comprovante da passagem e comprovante de pagamento. Encaminhar ao financeiro/contas a pagar para análise; se autorizado, coletar dados bancários do titular (banco, agência, conta, CPF, nome completo). Acompanhar ativamente em caso de demora.", "r": "Para solicitar o reembolso da sua viagem, me envie o comprovante da passagem e o comprovante de pagamento 😊 Vou encaminhar para análise do nosso financeiro e, se autorizado, retorno pedindo seus dados bancários para o depósito. Fico acompanhando e te aviso assim que houver novidade! 💙", "sla": ""}, {"g": "Financeiro", "m": "MGM", "s": "Desconto por indicação (Programa MGM)", "i": "Validação do MGM exige: (1) indicação sinalizada ao consultor no ato da matrícula e (2) formulário de indicação preenchido — ambos obrigatórios. A bolsa do indicador é lançada após o primeiro pagamento do indicado (desconto no mês seguinte). Sem formulário, o desconto não é validado. Divergências: confirmar com o financeiro antes de prometer isenção.", "r": "Sobre o desconto por indicação (MGM): para ser validado, a indicação precisa ter sido informada ao consultor no ato da matrícula e o formulário de indicação preenchido. A bolsa é lançada após o primeiro pagamento do(a) aluno(a) indicado(a), então o desconto aparece na mensalidade seguinte 😊 Vou verificar como está o seu caso e te retorno!", "sla": ""}, {"g": "Comunicação", "m": "Grupo da turma", "s": "Grupo de WhatsApp da turma", "i": "O grupo é criado próximo ao início das aulas; o convite chega por WhatsApp. Nele circulam: link do Zoom no dia da aula, informações dos encontros presenciais (enviadas ~1 dia antes) e avisos. Se o aluno não recebeu o convite, verificar o telefone cadastrado e reenviar.", "r": "O grupo de WhatsApp da sua turma é criado pertinho do início das aulas e você recebe o convite por WhatsApp 📲 É por lá que enviamos o link das aulas ao vivo, as informações dos encontros presenciais e os avisos importantes. Se não receber o convite até o início do curso, me avisa que eu verifico seu cadastro e reenvio! 💙", "sla": ""}, {"g": "Onboarding", "m": "Kit de boas-vindas", "s": "Jaleco, crachá e guia de tamanhos", "i": "No onboarding, coletar: tamanho do jaleco (jalecos Dra. Cherie — enviar o Guia de Jalecos em PDF para dúvidas de medida), nome para bordado e foto para o crachá (rosto, fundo branco/claro, padrão RG). Alteração de tamanho após o formulário só é possível enquanto o kit não entrou em produção — confirmar com o time responsável antes de garantir a troca.", "r": "Para preparar o seu kit de boas-vindas, preciso de três informações: 🔹 tamanho do jaleco (nossos jalecos são da Dra. Cherie — se tiver dúvida, te envio o guia de medidas!) 🔹 nome que deseja bordar 🔹 foto para o crachá — de rosto, com fundo branco ou claro, padrão RG (pode ser uma selfie, desde que o rosto esteja bem visível 😉).", "sla": ""}, {"g": "Financeiro", "m": "Cancelamento", "s": "Reembolso, multas e pontos focais (cancelamento)", "i": "Caso o aluno cancele por ter passado na residência, não há cobrança de multa contratual.\n\nReembolso da matrícula:\n• Venda protegida: 100% do valor pago — até 1 dia antes do início das aulas.\n• Sem proteção: 80% do valor pago — até 20 dias antes do início das aulas.\n\nMultas e negociação:\n• Os boletos vencidos devem ser pagos.\n• Se for venda protegida, o aluno pode cancelar até 2 meses após o início das aulas sem cobrança de multa.\n• A multa é de 10% sobre os boletos a vencer.\n• Considera-se, para fins financeiros, a data da solicitação.\n• A multa é gerada em parcela única; o aluno pode solicitar o parcelamento, sujeito à avaliação do time de cobranças.\n\nPontos focais: Atendimento Financeiro — Elza Duarte Rocha; Cobranças e Negociações — Ada Cristina Buso.", "r": "Sobre o cancelamento:\n\nReembolso da matrícula:\n• Venda protegida: 100% do valor pago, até 1 dia antes do início das aulas.\n• Sem proteção: 80% do valor pago, até 20 dias antes do início das aulas.\n\nMultas e negociação:\n• Os boletos vencidos devem ser pagos;\n• Se for venda protegida, você pode cancelar até 2 meses após o início das aulas sem a cobrança da multa;\n• A multa é de 10% sobre os boletos a vencer;\n• Considera-se, para fins financeiros, a data da solicitação;\n• O valor total da multa é gerado em parcela única; você pode solicitar o parcelamento, porém será realizada a avaliação pelo time de cobranças.\n\nObs.: caso o cancelamento seja por aprovação em residência, não há cobrança de multa contratual.", "sla": ""}, {"g": "Acadêmico", "m": "Curso de Psiquiatria", "s": "Psiquiatria Clínica e Prova de Título (exclusivo Psiquiatria)", "i": "A Pós-Graduação em Psiquiatria Clínica é lato sensu, reconhecida pelo MEC. A conclusão do curso, isoladamente, não garante a inscrição na Prova de Título de Especialista em Psiquiatria da ABP/AMB. Caminhos previstos: Residência Médica em Psiquiatria, Programa de Formação acreditado pela ABP ou comprovação de 6 anos de atuação prático-profissional na área. A pós contribui com aprofundamento teórico e experiência prática supervisionada para esse terceiro caminho.", "r": "A Pós-Graduação em Psiquiatria Clínica da São Leopoldo Mandic é uma pós-graduação lato sensu reconhecida pelo MEC. A conclusão do curso, isoladamente, não garante a inscrição na Prova de Título de Especialista em Psiquiatria da ABP/AMB.\n\nAtualmente, entre os caminhos previstos para acesso à prova estão a Residência Médica em Psiquiatria, o Programa de Formação acreditado pela ABP ou a comprovação de 6 anos de atuação prático-profissional na área, conforme os critérios e documentos exigidos no edital vigente.\n\nÉ justamente neste terceiro caminho que a pós-graduação pode ter um papel importante na sua trajetória: ela proporciona aprofundamento teórico e experiência prática supervisionada, contribuindo para que o médico desenvolva conhecimento e segurança para ampliar suas oportunidades na área de saúde mental e Psiquiatria.\n\nCumpridos futuramente os requisitos da ABP, o médico poderá prestar a Prova de Título e, após a obtenção do título, solicitar o respectivo RQE junto ao CRM.", "sla": ""}], "macros": [{"t": "Login e Senha- Concierge", "b": "Seus dados de acesso foram enviados no e-mail cadastrado no ato da matrícula. \n\nMas vou te enviar novamente por aqui. \n\nRA: \nSenha: slmaluno\n\nEsses dados você usará para acessar tudo na Mandic!  \n\n\n\nAulas online: A plataforma é a Blackboard, onde você poderá assistir às gravações das aulas e acessar todos os conteúdos disponibilizados pelos professores. 📚💻 \n\n \n\nLink de acesso à Blackboard: https://slmandic.blackboard.com/webapps/login/\n\nO acesso será liberado quando suas aulas começarem. O link das aulas será enviado através do grupo de WhatsApp, cujo convite você receberá em brave, caso ainda não tenha recebido.\n\n\n\nFinanceiro (boletos):  \n\nNo portal você irá consultar seus boletos e gerar o código de barras para pagamento.  \n\nPortal do Aluno:\n\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/"}, {"t": "Transferência Interna- Concierge", "b": "Olá, prezados.\nEspero que estejam todos bem.\n\nSolicito a transferência da aluna do curso de DI: (Informe o DI ATUAL) para (Informe O DI FUTURO).\n\nRealizar aproveitamento da matricula.\n\nSegue o plano de pagamento: \nX x R$XXX,XX + XX parcelas de R$X.XXX,XX\nTotal: R$ XX.XXX,XX\n\nMotivo: (descreva aqui)\n\nAtenciosamente,"}, {"t": "Solicitação de declaração- Concierge", "b": ""}, {"t": "Certificado de conclusao/diploma- Concierge", "b": "O certificado será disponibilizado em até 90 dias úteis, após o envio completo da documentação obrigatória.\n\nCaso ainda não tenha enviado, pedimos a gentileza de encaminhar o quanto antes os documentos listados abaixo, todos em formato PDF, para o e-mail: secretaria@slmandic.edu.br 📩\n\nDocumentos necessários:\n• RG\n• CPF\n• Comprovante de residência\n• Certidão de nascimento ou casamento\n• Diploma de graduação\n• CRM\n• Carteirinha de vacinação\n\n💡 Importante: os documentos devem ser escaneados e enviados em formato PDF, tudo bem? A secretaria não aceita arquivos em formato de foto, então é essencial garantir que estejam no padrão correto para evitar qualquer devolução."}, {"t": "Saudação Concierge", "b": "Olá, ! Como você está? 😊\n\nMeu nome é . Será um prazer te ajudar, darei continuidade ao seu atendimento."}, {"t": "Ajudo - Concierge", "b": "Posso te auxiliar em algo mais?"}, {"t": "Desculpa (alto fluxo de atendimento)- Concierge", "b": "Peço sinceras desculpas pela demora no retorno. Estamos com uma alta demanda de atendimentos em nossos canais, o que impactou nosso tempo de resposta."}, {"t": "Portal do aluno- Concierge", "b": "Portal do aluno: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/  \n \nPara que utilizar? Notas, Frequência, boletos, informe de rendimentos e redirecionamento para a Blackboard.  \n\n\n\nPara que você consiga baixar seus boletos é necessário permitir o Pop- Up e como fazer isso? \n \n \nSafari: \n \n1. Localize e abra o aplicativo Ajustes no seu dispositivo. \n2. Role para baixo e toque em Safari. \n3. Localize a opção Bloquear Pop-ups e desative-a \n \nGoogle Chrome: \n \n1. Acesse o navegador Google Chrome no seu computador/celular. \n2. Clique no menu do Chrome (os três pontos verticais no canto superior direito) e selecione \"Configurações\".  \n3. No menu lateral, clique em \"Privacidade e segurança\". \n4. Em seguida, clique em \"Configurações do site\". \n5. Localize a seção \"Pop-ups e redirecionamentos\". \n6. Escolha a configuração: Selecione a opção \"Permitir que todos os sites exibam pop-ups\" ou adicione exceções para sites específicos que você deseja permitir que mostrem pop-ups."}, {"t": "Blackboard- Concierge", "b": "Blackboard:  \nAulas online: A plataforma é a Blackboard, onde você poderá assistir às gravações das aulas e acessar todos os conteúdos disponibilizados pelos professores. 📚💻 \n \nLink de acesso à Blackboard: https://slmandic.blackboard.com/webapps/login/ \nLogin: \nSenha: slmaluno"}, {"t": "Foto para o crachá- Concierge", "b": "Siga o mini guia abaixo para enviar a melhor foto para o seu crachá. 🤗\n\n\n\n💡 Boa iluminação\n\nSem sombras no rosto.\n\n\n\n👤 Posição\n\nA foto deve conter o rosto centralizado, de frente e visível.\n\n\n\n🖼️ Fundo neutro\n\nBranco ou cinza claro, para que a imagem fique nítida.\n\n\n\n⚜️ Qualidade\n\nA foto deve ser em boa definição, sem borrões."}, {"t": "Falta de interação- Concierge", "b": "Como não recebemos retorno, vamos encerrar este atendimento por agora.\nMas fique totalmente à vontade para nos contatar novamente sempre que precisar, estaremos aqui para ajudar. 😊\n\n\n\nAté breve!"}, {"t": "Não Retido (Concierges)", "b": "A.C\n\nO(a) aluno (a) {{ticket.requester.name}} passou pelo processo de retenção sem êxito e, portanto, seguirá com o cancelamento da matrícula.\n \n\nN2 – Secretaria:\nSolicitamos, por gentileza, o prosseguimento do cancelamento acadêmico. Após a conclusão, pedimos que o ticket seja direcionado ao grupo Atendimento – Financeiro.\n \n\nAtendimento – Financeiro:\nSolicitamos, por gentileza, o prosseguimento do cancelamento contratual."}, {"t": "Faltas e reposições- Concierge", "b": "Você tem direito a faltar até 25% do módulo, isso significa que se você faltar uma aula online apenas e até 1 dia do presencial, não reprova o módulo, mas se faltar dois dias do presencial ou então 2 aulas online é necessário repor todas as aulas pois não atinge a quantidade mínima de frequência exigida por módulo, que é 75%. \n\nCaso reprove no módulo, você tem direito a uma reposição gratuita, as demais são cobradas.\nVocê tem direito a uma reposição gratuita, as demais são cobradas."}, {"t": "Encerramento - Concierge", "b": "Ficamos felizes em saber que, por enquanto, suas dúvidas foram esclarecidas, com isso, vamos encerrar este atendimento.\nSeguimos sempre à disposição e, se precisar de qualquer coisa, é só nos chamar por aqui que retomamos a conversa!\n \nApós finalizarmos a conversa, convidamos você a avaliar o atendimento recebido. Sua opinião é muito importante para continuarmos melhorando nossos serviços. 💙💛"}, {"t": "Endereço SP- Concierge", "b": "O endereço da unidade é: R. da Consolação, 1601- 17° andar ☺️ \n\n \n\n🚗 Para quem vier de carro, a faculdade oferece estacionamento interno. Valor da diária: R$40,00"}, {"t": "Endereço Campinas- Concierge", "b": "O endereço da unidade é: R. Abolição, 1874 – Ponte Preta, Campinas/SP\n\n\n\n👉 Estacionamento disponível dentro da faculdade (R$ 22,00 a diária)."}, {"t": "Carteirinha- Concierge", "b": "Não emitimos carteirinha de estudante, mas posso solicitar a confecção da declaração de matrícula para você. Com ela, é possível solicitar a Carteirinha Nacional de Estudante (DNE) diretamente no site oficial, e a versão online costuma ficar pronta no mesmo dia.\n \nSite: Documento Nacional do Estudante"}, {"t": "Horário de aula online- Concierge", "b": "Aula online:\n\n🕢 Horário: 19h30 (horário de Brasília).\n\n\n💻 A plataforma utilizada será o Zoom.\n\nMinha dica é: baixe o aplicativo com antecedência, para garantir um acesso mais tranquilo no dia da aula. 🙃\n\n\n\n📱 Posso assistir pelo celular?\n\n➡️ Pode sim! Porém, não recomendo, pois a visualização e a interação ficam mais limitadas pelo tamanho da tela. Se possível, priorize computador ou notebook.\n\n\n\n📝 Teremos lista de presença?\n\n➡️ Sim! A presença será contabilizada de acordo com o tempo de permanência na aula.\n\nPor isso, é fundamental acessar o Zoom com nome e sobrenome, para que o time consiga identificar você corretamente.\n\n\nCaso queira assistir às aulas depois, acesse o Blackboard: https://slmandic.blackboard.com/webapps/login/\n\n✨ Lembrete importante: assistir à gravação não contabiliza presença. Para garantir sua participação, é essencial estar ao vivo, no horário da aula.\n\n\n\nO link da aula será enviado no grupo da turma!"}, {"t": "Informe de Rendimentos- Concierge", "b": "Você pode emitir seu Informe de Rendimentos diretamente pelo Portal do Aluno. Siga as orientações abaixo:\n\n1 Acesse o Portal do Aluno. \n2️ Clique em “Alterar Curso” e selecione o semestre/ano desejado. \n3️  No menu superior, acesse a aba “Relatórios”. \n4️  Selecione a opção “Informe de Rendimentos” para gerar o documento.\n\n📌 A emissão é imediata, e o arquivo poderá ser salvo em formato PDF.\n\n\n\n🔗 Portal do Aluno: \nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n\n\n\n\n\n🔐 Acesso:\nSeu login é o RA e a senha padrão é slmaluno 🙂\n\nSe você não souber seu login, você consegue visualizar ele no seu crachá da Mandic, ou pode me informar seu CPF que eu te ajudo com isso, ok? 💬"}, {"t": "Boleto- Concierge", "b": "Seu boleto já está disponível para emissão diretamente no Portal do Aluno.\n\nPara acessá-lo, siga o passo a passo abaixo:\n\n• Acesse o Portal do Aluno;\n• No canto superior direito, clique na opção “Alterar Curso”;\n• Selecione o curso atual ou, se preferir, tente acessar pelos demais cursos disponíveis;\n• Em seguida, acesse a aba “Financeiro” para verificar a emissão do boleto.\n\n\n\n🔗 Portal do Aluno:\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n\n\n\n🔐 Acesso:\nSeu login é o RA e a senha padrão é slmaluno 🙂\n\nSe você não souber seu login, você consegue visualizar ele no seu crachá da Mandic, ou pode me informar seu CPF que eu te ajudo com isso, ok? 💬\n\n\n\nCaso você não consiga baixar o boleto, certifique-se de que o pop-up está permitido. E como fazer isso: \n \nGoogle Chrome: \n \n1. Acesse o navegador Google Chrome no seu computador/celular. \n2. Clique no menu do Chrome (os três pontos verticais no canto superior direito) e selecione \"Configurações\".  \n3. No menu lateral, clique em \"Privacidade e segurança\". \n4. Em seguida, clique em \"Configurações do site\". \n5. Localize a seção \"Pop-ups e redirecionamentos\". \n6. Escolha a configuração: Selecione a opção \"Permitir que todos os sites exibam pop-ups\" ou adicione exceções para sites específicos que você deseja permitir que mostrem pop-ups. \n \nSafari: \n \n1. Localize e abra o aplicativo Ajustes no seu dispositivo. \n2. Role para baixo e toque em Safari. \n3. Localize a opção Bloquear Pop-ups e desative-a"}, {"t": "Demora atendimento- Concierge", "b": "Olá, {{ticket.requester.first_name}}! Como você está? 😊\n\nSou {{ticket.assignee.first_name}}, do Apoio ao Estudante - Campinas. Pedimos desculpas pela demora, estamos com grande fluxo de mensagens.\n \n\nComo posso te ajudar hoje?"}, {"t": "Avaliações e TCC- Concierge", "b": "A pós-graduação não possui provas nem trabalho de conclusão. A aprovação é baseada na presença nas aulas (presenciais e online) e na avaliação do professor durante as atividades práticas."}, {"t": "Declaracao de Matricula- Concierge", "b": "Você pode emitir sua Declaração de Matrícula diretamente no Portal do Aluno, seguindo este caminho:\nRelatórios > Declaração de Vínculo\n\nA emissão é imediata, e você poderá salvar o documento em PDF.\n\n\n\n🔗 Acessar Portal do Aluno:\nhttps://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/"}, {"t": "Pop-UP- Concierge", "b": "Para permitir o pop-up siga o passo a passo abaixo: \n \n\nGoogle Chrome: \n \n1. Acesse o navegador Google Chrome no seu computador/celular. \n2. Clique no menu do Chrome (os três pontos verticais no canto superior direito) e selecione \"Configurações\".  \n3. No menu lateral, clique em \"Privacidade e segurança\". \n4. Em seguida, clique em \"Configurações do site\". \n5. Localize a seção \"Pop-ups e redirecionamentos\". \n6. Escolha a configuração: Selecione a opção \"Permitir que todos os sites exibam pop-ups\" ou adicione exceções para sites específicos que você deseja permitir que mostrem pop-ups. \n \nSafari: \n \n1. Localize e abra o aplicativo Ajustes no seu dispositivo. \n2. Role para baixo e toque em Safari. \n3. Localize a opção Bloquear Pop-ups e desative-a"}, {"t": "Limite de Faltas- Concierge", "b": "Para sua aprovação você deve ter presença em 75% das aulas do módulo, isso é, caso você falte uma aula, não tem problema, mas fique atento para não reprovar no módulo caso falte mais 😉"}, {"t": "Notas e Faltas- Concierge", "b": "Para visualizar suas notas e faltas, acesse o Portal do Aluno através do link: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/"}, {"t": "Gravação de aulas - Concierge", "b": "As gravações das aulas ficam disponíveis na Blackboard, a partir de 2 dias úteis, após a data da aula. 😊"}, {"t": "Diploma- Concierge", "b": "Após a conclusão, ocorre o fechamento da portaria do curso e validação com o conselho (a validação ocorre em uma reunião bimestral). Finalizado este processo, o certificado entra em processo de emissão e assinatura, contando prazo de 90 dias úteis.\n\nQuando finalizado, será encaminhado ao seu e-mail :)"}, {"t": "Regras de cancelamento- Concierge", "b": "O boletos vencidos devem ser pagos;\n\nSe for venda protegida, o aluno pode cancelar até 2 meses após inicio das aulas sem a cobrança da multa;\n\nA multa gerada são de 10% sobre os boletos a vencer;\n\nConsidera-se para fins financeiros a data da solicitação;\n\n\n\nO valor total da multa é gerado em parcela única, você pode solicitar o parcelamento, porém será realizado a avaliação pelo time de cobranças."}, {"t": "Aulas opcionais Pós Online- Concierge", "b": "Você tem direito a realizar até 2 dias de aulas práticas no total.\n\nEsses dias podem ser utilizados da forma que for melhor para você: pode escolher 1 dia em um módulo e 1 dia em outro módulo, ou realizar os 2 dias dentro do mesmo módulo.\n\nCaso deseje agendar as práticas, fico à disposição para te orientar."}]}, {"name": "Orientações Gerais", "items": [{"g": "Portal do Aluno", "m": "Dados de acesso", "s": "Login e senha - Graduação", "i": "Consultar RA no TOTVS. Senha padrão: slmaluno. Orientar alteração no primeiro acesso.\n\nReset de senha TOTVS (Pós Médica): Contexto Educacional > Coligada 25 > 2x nome > ícone cadeado > slmaluno > Salvar.", "r": "Bem-vindo à São Leopoldo Mandic! ⚜️\n\nSeus dados de acesso:\n• Login: seu RA\n• Senha: slmaluno\n*Orientamos que altere a senha após o primeiro acesso.\n\nLinks:\n• Portal do Aluno: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n• Blackboard: https://slmandic.blackboard.com/webapps/login/\n\n📲 App SLMandic:\nAndroid: https://play.google.com/store/apps/details?id=br.edu.slmandic.app\niOS: https://apps.apple.com/br/app/slmandic/id1573777391", "sla": ""}, {"g": "Portal do Aluno", "m": "Dados de acesso", "s": "Acesso Responsável Acadêmico e Financeiro", "i": "Resp. Acadêmico: A + CPF, senha: slmacademico.\nResp. Financeiro: F + CPF, senha: slmfinanceiro.\nSe o mesmo for ambos, só o financeiro é criado e associado aos 2 cadastros.", "r": "🔹 Responsável Acadêmico: Login A + CPF (ex.: A01234567890), Senha: slmacademico\n🔹 Responsável Financeiro: Login F + CPF (ex.: F01234567890), Senha: slmfinanceiro\n\n🔗 https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": ""}, {"g": "Portal do Aluno", "m": "Dados de acesso", "s": "Informações de Acesso - Pós-Graduação", "i": "Sistemas: Portal do Aluno, Blackboard, Wi-Fi. No 1º acesso: inserir usuário/senha > alterar senha (login unificado). Dados intransferíveis.\n\nPortal: comunicados, notas, frequências, requerimentos, boletos.\nBlackboard: aulas gravadas/ao vivo, notas de provas.\nAulas online: login BB > CURSOS > período > BB Collaborate > Participar da Sessão.\nDica: acessar 15 min antes, usar Google Chrome.\n\nContatos: Apoio (19) 3211-3647 / Financeiro (19) 3211-3633.", "r": "Sistemas institucionais:\n• Portal do Aluno: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n• Blackboard: https://slmandic.blackboard.com/\n• App SLMandic (Android/iOS)\n\nNo 1º acesso, altere a senha para unificar todos os acessos.\n\nDicas para aulas online:\n• Acesse o Blackboard 15 min antes\n• Use Google Chrome\n\nContatos:\n• Apoio: (19) 3211-3647 / apoio.estudante@slmandic.edu.br\n• Financeiro: (19) 3211-3633 / financeiro.atendimento@slmandic.edu.br", "sla": ""}, {"g": "Plataformas / TI", "m": "Blackboard", "s": "Problemas de acesso ao Blackboard", "i": "1. Verificar credenciais.\n2. TOTVS > Campos Complementares: checar flag de bloqueio.\n3. Verificar matrícula ativa antes de desbloquear.\n4. Reset de senha.\n5. Se persistir, verificar cadastro no BB.\n\nEncaminhamento: App/AVIDA/BB/Odontosig/Sites → Raphael | Portal/Wi-Fi/AD → André De Aro", "r": "Para acessar o Blackboard:\n🔗 https://slmandic.blackboard.com/webapps/login/\nLogin: seu RA | Senha: slmaluno (ou a que você definiu)\n\nSe não conseguir acessar, entre em contato conosco.", "sla": ""}, {"g": "Plataformas / TI", "m": "Blackboard", "s": "Erros ao visualizar conteúdo ou provas", "i": "Orientar o aluno a contatar o instrutor do curso. Gerenciamento de conteúdos é restrito aos professores.", "r": "Para questões de conteúdo ou provas na Blackboard, entre em contato com o professor/instrutor do módulo.", "sla": ""}, {"g": "Plataformas / TI", "m": "Blackboard", "s": "Disciplina/curso não encontrado", "i": "Verificar matrículas no TOTVS. Orientar pesquisa por código/período/nome com filtros. Se não encontrar, encaminhar ticket (Raphael).", "r": "Pesquise pelo código, período ou nome do curso usando os filtros do Blackboard. Se não encontrar, entre em contato conosco.", "sla": ""}, {"g": "Plataformas / TI", "m": "App SLMandic", "s": "QR Code não gerado / Divergências no app", "i": "QR Code: divergência entre APP e Sésamo. Verificar e comparar cadastros.\nCarteirinha/Grade: encaminhar para equipe de APP (Raphael).", "r": "Caso tenha problemas com QR Code ou divergências no app, entre em contato para verificarmos seu cadastro.", "sla": ""}, {"g": "Plataformas / TI", "m": "App SLMandic", "s": "E-mail institucional e Pacote Office 365", "i": "Domínios: @med / @odonto .slmandic.edu.br. Solicitar pelo App. Licença E1 = uso ONLINE (portal.office.com). NÃO permite ativação no dispositivo.\nRecursos: Office Online, Outlook 50GB, OneDrive 1TB, SharePoint, Teams.", "r": "Para solicitar e-mail institucional e Office 365:\n📌 App SLMandic: Atendimento > Solicitar Office 365\n\nAcesse: http://portal.office.com\nLogin: e-mail institucional | Senha: mesma do app\n\nRecursos: Office Online, Outlook (50GB), OneDrive (1TB), SharePoint, Teams.\n⚠️ Uso exclusivamente online — não é possível instalar no dispositivo.", "sla": ""}, {"g": "Plataformas / TI", "m": "Portal do Aluno", "s": "Desbloqueio de Pop-up", "i": "Necessário para baixar boletos. Orientar conforme navegador.", "r": "Para desbloquear pop-ups:\n\n🔹 Google Chrome: Menu (⋮) > Configurações > Privacidade e segurança > Configurações do site > Pop-ups e redirecionamentos > Permitir\n\n🔹 Safari: Ajustes > Safari > Desative \"Bloquear Pop-ups\"", "sla": ""}, {"g": "Plataformas / TI", "m": "Acesso a plataformas", "s": "Fluxo geral de atendimento (interno)", "i": "Plataformas: Blackboard, AVA (Avida), Portal, App, Educat.\n1. Coleta: descrição + print.\n2. Verificar matrícula + bloqueios TOTVS.\n3. Sem pendências: reset de senha → testar → GLPI se não resolver.\n4. Com pendências: confirmar com Secretaria/Financeiro.\n5. Educat: acionar setor Avalia.", "r": "", "sla": ""}, {"g": "Plataformas / TI", "m": "Verdanadesk", "s": "Abertura de chamado (TI interno)", "i": "Via Intranet > Sistema de Chamados > Criar chamado > selecionar área no catálogo > formulário > preencher (tipo, urgência, local, título, descrição) > anexar arquivos > enviar.\nDono do processo: Departamento de Tecnologia. V0 - Abril/2026.", "r": "", "sla": ""}, {"g": "Plataformas / TI", "m": "Sistema Optimus", "s": "Abertura de solicitações de manutenção", "i": "Login/senha unificados por departamento. SOLICITAÇÕES → GERENCIAR → INCLUIR SOLICITAÇÃO. Descrever demanda + local + fotos. Imagens auxiliam atendimento mais rápido.", "r": "", "sla": ""}, {"g": "Administrativo", "m": "Crachá / Catraca", "s": "Confecção de crachás (Campinas e Unidades)", "i": "Graduação: levantamento TOTVS, foto via RD, confecção, SESAMO, entrega aula inaugural.\nPós: elegíveis = lato/stricto sensu + presenciais >3 meses. EAD e <3 meses = provisório.\nUnidades externas: e-mail equipe.apoio.estudante@slmandic.edu.br, até quinta, prazo 10 dias. Confecção sábados, envio segundas.\nPlanilha: Nome, RA, Validade. Fotos .png nomeadas. Requisitos: rosto frontal, colorida, sem boné/óculos.\nCódigos: Ribbon 02.01.08.00021 (310268) / Crachá RFID 02.01.08.00001 (007049). 1 ribbon ≈ 300 crachás.\n\nCadastro Sésamo: aba Credenciado > CPF > Nome > Categoria (Grad/Pós) > Perfil de Acesso (unidade) > Empresa SL Mandic > Validade > Confirmar.\nAssociação crachá: Associar Chave > nº Chave Eletrônica (traseira cartão) > Confirmar 2x.", "r": "", "sla": ""}, {"g": "Administrativo", "m": "Infraestrutura", "s": "Reserva de sala de estudos", "i": "Via Conecta: Administrativo > Reservas > Reserva de Sala. Antecedência mín. 2 dias úteis. Sem equipamentos: agendamento@slmandic.edu.br. Com equipamentos (Odonto): + Coordenação. Não contempla tutoria.", "r": "Pelo Conecta: Enviar solicitação > Administrativo > Reservas > Reserva de Sala.\n\nFaça com 3 a 5 dias de antecedência e informe:\n• Horário de início e término\n• Qual laboratório/sala\n• Equipamentos necessários\n\n🔗 Portal: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": "2 Dias Úteis"}, {"g": "Administrativo", "m": "Armários", "s": "Chave reserva - Odontologia", "i": "Via Conecta: Administrativo > Reservas > Solicitação de Chave Reserva. Devolução: 2 dias. Aluno providencia cópia.", "r": "📌 Conecta > Administrativo > Reservas > Solicitação de Chave Reserva\n\n🔗 Portal: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/\n📲 App: Android / iOS", "sla": ""}, {"g": "Administrativo", "m": "Armários", "s": "Controle de armários (Odontologia e Medicina)", "i": "Odonto: 208 armários Bloco B. Chave fornecida pelo Apoio. Empréstimo reserva: 2 dias.\nMedicina: 414 armários Bloco N. Cadeado do aluno. Abertura via Optimus (presença obrigatória aluno + colaborador).\nFormandos: comunicação RD para devolução. Controle via planilha Excel.", "r": "", "sla": ""}, {"g": "Administrativo", "m": "Carteirinha estudantil", "s": "Carteirinha de meia-entrada", "i": "A instituição NÃO emite carteirinha de meia-entrada. Crachá = acesso às dependências. Orientar DNE pela UNE.", "r": "O crachá da instituição é apenas para acesso às dependências.\nPara carteirinha de meia-entrada, solicite pelo site do Documento Nacional do Estudante:\n🔗 https://www.documentodoestudante.com.br/", "sla": ""}, {"g": "Administrativo", "m": "Liberação de acesso", "s": "Alunos de outras unidades em Campinas", "i": "Unidade solicita via equipe.apoio.estudante@slmandic.edu.br (1 semana antecedência). Dados: datas, turma, nome, RA. Validar matrícula TOTVS. Com Sésamo: multiperfil. SP (sem Sésamo): cadastro completo. Retornar informando liberação.", "r": "", "sla": ""}, {"g": "Administrativo", "m": "Boas-Vindas", "s": "Kit Pós-Graduação Odontologia", "i": "Entrega no 1º dia pelo Time de Boas-Vindas. Ausentes: Apoio verifica turma → entrega → registra (nome, RA, curso) → Teams. Monitorar estoque e solicitar reposição ao Time de Pós.", "r": "", "sla": ""}, {"g": "Administrativo", "m": "Comunicados", "s": "Envio de comunicado interno", "i": "Via e-mail equipe.apoio.estudante@slmandic.edu.br. Prazo mín: 72h. Conteúdo: texto/arte + público-alvo + data. Fluxo: TOTVS-RM (base atualizada) → RD → teste supervisor → programar → responder com print.", "r": "", "sla": ""}, {"g": "Acadêmico", "m": "Atestado médico", "s": "Regras e envio de atestado", "i": "Não há previsão legal para abono de faltas apenas com atestado. Limite de 25% contempla afastamento. Entrega em até 5 dias úteis da data inicial.\nEnvio via Conecta: Acadêmico > Dúvidas e Solicitações Gerais > Entrega de Atestado Médico.", "r": "Pontos importantes sobre atestado médico:\n• O atestado não abona faltas automaticamente — serve como justificativa acadêmica.\n• O limite de 25% de faltas contempla o período de afastamento.\n• Envio em até 5 dias úteis da data do afastamento.\n\nConecta > Acadêmico > Dúvidas e Solicitações Gerais > Entrega de Atestado Médico.", "sla": "2 Dias Úteis"}, {"g": "Acadêmico", "m": "Emissão de documentos", "s": "Declaração de Frequência / Faltas", "i": "Via Conecta: Acadêmico > Emissões de Documentos > Declaração de Frequência/Falta. Prazo: 3-5 dias úteis. Necessário lançamento dos professores no sistema.", "r": "📌 Conecta > Acadêmico > Emissões de Documentos > Declaração de Frequência / Falta\n⏳ Prazo: 3 a 5 dias úteis.\nObs.: Necessário que os professores tenham efetuado os lançamentos.\n\n🔗 Portal: https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": "5 Dias Úteis"}, {"g": "Acadêmico", "m": "Emissão de documentos", "s": "Relatório de Atividades Complementares", "i": "Emissão imediata: Portal > Relatórios > Relatório de Atividades Complementares.", "r": "Portal do Aluno > Relatórios > Relatório de Atividades Complementares\nEmissão imediata, salve em PDF.\n🔗 https://portal.slmandic.edu.br/FrameHTML/web/app/edu/portaleducacional/login/", "sla": ""}, {"g": "Acadêmico", "m": "Envio de documentos", "s": "Guia de envio - Graduação", "i": "Via inscricao.slmandic.edu.br. Login CPF/e-mail + nascimento. Documentação matrícula > Anexar (1 por arquivo, PDF/PNG/JPG, máx 5MB). Enviar em até 10 dias.\nObrigatório: declaração vacinal (Hepatite B 3 doses, tríplice viral, dupla adulto, varicela, Influenza, anti-HBS).\nEstrangeiros: tradução juramentada + Certidão de Equivalência.", "r": "1. Acesse: inscricao.slmandic.edu.br\n2. Login: CPF ou e-mail + data de nascimento\n3. \"Verificar\" em \"Documentação matrícula\"\n4. Anexe cada documento (1 por arquivo, PDF/PNG/JPG, máx 5MB)\n5. Clique \"Enviar\"\n\n⏳ Envie em até 10 dias após matrícula financeira.\n⚠️ Fotos de celular sem digitalização não serão aceitas.", "sla": ""}, {"g": "Acadêmico", "m": "Envio de documentos", "s": "Guia de envio - Pós-Graduação Odontologia", "i": "Portal > Cadastro Acadêmico > aba Documentos. Status 1 ou 3 = ícone clipe para anexar. PDF, máx 5MB. Enviar em até 10 dias. Após 30 dias sem documentação, contrato pode ser cancelado.", "r": "1. Portal do Aluno > canto superior direito > \"Cadastro Acadêmico\"\n2. Aba \"Documentos\"\n3. Documentos com status 1 ou 3 possuem ícone de clipe\n4. Formato PDF, máx 5MB\n\n⏳ Envie em até 10 dias.\n⚠️ Após 30 dias sem documentação, o contrato pode ser cancelado.", "sla": ""}, {"g": "Acadêmico", "m": "Módulo Mandic", "s": "O que é e principais dúvidas (Pós Odonto)", "i": "Eixo transversal obrigatório nas especializações. 4 disciplinas de 8h: Radiologia/Imaginologia, Gestão de Consultórios, Fotografia Odontológica, IA Aplicada. Reposição gratuita (1ª vez); 2ª sem comparecimento = cobrança. Solicitar via Portal.", "r": "O Módulo Mandic é obrigatório para conclusão da especialização. São 4 disciplinas de 8h:\n• Radiologia e Imaginologia para Diagnóstico\n• Gestão Aplicada a Consultórios\n• Fotografia Odontológica\n• IA Aplicada à Gestão\n\n✅ Obrigatório? Sim.\n✅ Reposição? Gratuita na 1ª vez. Cobrança a partir da 2ª sem comparecimento.\n✅ Solicitar reposição pelo Portal do Aluno.", "sla": ""}, {"g": "Acadêmico", "m": "Encontro Nacional", "s": "FAQ Encontro Nacional dos Mestrados Mandic", "i": "Imersão presencial em Campinas para mestrandos. 3 trilhas: Docência & Pesquisa, Gestão/Tecnologia/Inovação, Marketing & Experiência do Paciente. Obrigatório (disciplinas da matriz). Reposição: CPS via Portal, outras via secretaria.\nNÃO é Módulo Mandic.\nPróximo: 16-20/mar/2026, 9h-18h. 4 dias Unidade CPS + último dia Hotel Vitória (Av. José de Sousa Campos, 425).", "r": "Evento imersivo em Campinas com 3 trilhas de conhecimento. Participação obrigatória.\n\n📅 Próximo: 16 a 20/mar/2026, 9h às 18h\n📍 Unidade Campinas (4 dias) + Hotel Vitória (último dia)\n\nNão conseguirá participar? Solicite reposição:\n• Campinas: Portal do Aluno\n• Outras unidades: secretaria", "sla": ""}, {"g": "Comercial", "m": "Campanha MGM 2.0", "s": "Indicação de alunos", "i": "1ª indicação: garrafa. 2ª: 50% desconto parcela. Limite 2/aluno. Válido para Aperf. (>12m), Espec., Mestrado, Doutorado. Não retroativo. Desconto via workflow (até 6 parcelas). Fluxo: Apoio → Comercial (Teams) → validação.", "r": "🔹 1ª indicação válida: brinde exclusivo\n🔹 2ª indicação válida: 50% de desconto em parcela\n\nCompareça ao Apoio ao Estudante com seus dados e do indicado.\n🔗 https://slmandic.typeform.com/to/SIUunau2", "sla": ""}, {"g": "Processos Internos", "m": "Zendesk", "s": "Operação do Zendesk", "i": "Status: Novo, Aberto, Pendente, Espera, Resolvido, Indeferido/Cancelado.\nFluxo: abrir > atribuir > alterar assunto > salvar com mudança de status.\nObservação Interna: clicar ícone canal > 'Observação Interna'.\nConversa paralela: só e-mail/requerimentos. Lateral dir > + > E-mail. Resposta: 'Responder a todos' mantendo support@...zendesk.com. Para atualização automática: ticket em 'Espera'.\nReativar WhatsApp: Reach > ID integração > modelo msg > nº. Cada reativação gera custo.\nAtribuição: canto esquerdo > atribuído > nome ou Grupos. Incluir obs. interna ao transferir.", "r": "", "sla": ""}, {"g": "Processos Internos", "m": "TOTVS", "s": "Solicitações via TOTVS - Pós Médica", "i": "Contexto: TOTVS > Contexto Educacional > Coligada 25 > Pós-Graduação > Filial. Pesquisar por nome/RA. Unidade: CTRL+A > Consultas SQL > Contexto do Aluno.\nReset: 2x nome > cadeado > slmaluno > Salvar.\nDeclarações: Atividades Acadêmicas > Requerimentos > 2 – Sol. Acadêmicas > tipo. Especificar declaração. Prazo: 5 dias. Acompanhamento manual diário.\nBaixar: localizar aluno > CTRL+A > atendimentos > filtro todos > 2x nome > anexos > arquivos anexos > filtro todos > 2x nome > processos > salvar.", "r": "", "sla": ""}, {"g": "Processos Internos", "m": "Monitoria", "s": "Processo de monitoria", "i": "Prof. Scabora envia planilha. Apoio envia e-mails:\n• Aprovados (com 2 anexos da pasta Monitorias): orientar procurar professor, folha de assinaturas, relatório entre 02-09/jun. Só 1 monitoria/semestre.\n• Não aprovados: e-mail informativo sem anexos.\nRegra: planilha > campo STATUS > copiar classificados em cópia OCULTA.", "r": "", "sla": ""}]}]};
let tabIdx = DATA.tabs.findIndex(t=>t.name==='Pós Médica'); if(tabIdx<0) tabIdx=0;
let subview = 'faq'; // faq | macros (só Pós Médica)
const $=id=>document.getElementById(id);

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hi(s,q){s=esc(s); if(!q) return s; const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return s.replace(re,'<mark>$1</mark>')}

function buildTabs(){
  const el=$('tabs'); el.innerHTML='';
  DATA.tabs.forEach((t,i)=>{
    const b=document.createElement('button');
    b.textContent = t.name==='Pós Médica' ? 'Pós Médica & Macros' : t.name;
    if(i===tabIdx)b.classList.add('active');
    b.onclick=()=>{tabIdx=i;subview='faq';buildTabs();buildSub();buildFilters();render()};
    el.appendChild(b);
  });
}
function buildSub(){
  const el=$('subtabs'); const t=DATA.tabs[tabIdx];
  if(!t.macros){el.style.display='none';return}
  el.style.display='flex'; el.innerHTML='';
  [['faq','📚 FAQ Pós Médica'],['macros','⚡ Macros PG Med']].forEach(([k,label])=>{
    const b=document.createElement('button'); b.textContent=label;
    if(subview===k)b.classList.add('active');
    b.onclick=()=>{subview=k;buildSub();buildFilters();render()};
    el.appendChild(b);
  });
}
function buildFilters(){
  const sel=$('fg'); sel.innerHTML='<option value="">Todos os agrupamentos</option>';
  if(subview==='macros'){sel.style.display='none';return}
  sel.style.display='';
  const gs=[...new Set(DATA.tabs[tabIdx].items.map(i=>i.g))];
  gs.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o)});
}
function copyTxt(btn,txt){navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiado!';setTimeout(()=>btn.textContent='Copiar',1500)})}

function render(){
  const q=$('q').value.trim().toLowerCase(), fg=$('fg').value;
  const t=DATA.tabs[tabIdx]; const main=$('main'); main.innerHTML='';
  if(subview==='macros' && t.macros){
    const list=t.macros.filter(m=>!q||(m.t+' '+m.b).toLowerCase().includes(q));
    $('count').textContent=list.length+' macro(s)';
    if(!list.length){main.innerHTML='<div class="empty">Nenhuma macro encontrada.</div>';return}
    list.forEach(m=>{
      const c=document.createElement('div');c.className='card open';
      c.innerHTML='<div class="card-head"><div class="titles"><div class="motivo">Macro</div><div class="sub">'+hi(m.t,q)+'</div></div></div>'+
        '<div class="card-body"><div class="block aluno"><h4>Texto da macro <button class="copy">Copiar</button></h4><div class="txt">'+hi(m.b,q)+'</div></div></div>';
      c.querySelector('.copy').onclick=e=>{e.stopPropagation();copyTxt(e.target,m.b)};
      main.appendChild(c);
    });
    return;
  }
  let items=t.items.filter(it=>(!fg||it.g===fg)&&(!q||(it.g+' '+it.m+' '+it.s+' '+it.i+' '+it.r).toLowerCase().includes(q)));
  $('count').textContent=items.length+' item(ns)';
  if(!items.length){main.innerHTML='<div class="empty">Nenhum item encontrado.</div>';return}
  const groups={};
  items.forEach(it=>{(groups[it.g]=groups[it.g]||[]).push(it)});
  Object.entries(groups).forEach(([g,list])=>{
    const h=document.createElement('div');h.className='group-title';h.textContent=g;main.appendChild(h);
    list.forEach(it=>{
      const c=document.createElement('div');c.className='card'+(q?' open':'');
      let body='';
      if(it.i) body+='<div class="block interna"><h4>🔒 Orientação interna</h4><div class="txt">'+hi(it.i,q)+'</div></div>';
      if(it.r) body+='<div class="block aluno"><h4>💬 Resposta ao aluno <button class="copy">Copiar</button></h4><div class="txt">'+hi(it.r,q)+'</div></div>';
      c.innerHTML='<div class="card-head"><div class="titles"><div class="motivo">'+hi(it.m,q)+'</div><div class="sub">'+hi(it.s||it.m,q)+'</div></div>'+
        (it.sla?'<span class="sla">SLA: '+esc(it.sla)+'</span>':'')+'<span class="chev">▶</span></div><div class="card-body">'+body+'</div>';
      c.querySelector('.card-head').onclick=()=>c.classList.toggle('open');
      const cp=c.querySelector('.copy'); if(cp) cp.onclick=e=>{e.stopPropagation();copyTxt(e.target,it.r)};
      main.appendChild(c);
    });
  });
}
$('q').addEventListener('input',render);
$('fg').addEventListener('change',render);
buildTabs();buildSub();buildFilters();render();

</script>
